<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学院队伍 · 教师简历</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#fff; --line:#e6e8eb; --ink:#1f2329; --muted:#7a828c;
  --brand:#c0392b; --brand2:#e04b37; --chip:#f0f1f3; --gold:#b8860b;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
a{color:var(--brand);text-decoration:none}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;white-space:nowrap}
header h1 b{color:var(--brand)}
.count{color:var(--muted);font-size:13px}
.search{margin-left:auto;position:relative}
.search input{width:260px;max-width:60vw;padding:8px 12px 8px 32px;border:1px solid var(--line);
  border-radius:20px;font-size:14px;outline:none;background:var(--bg)}
.search input:focus{border-color:var(--brand2);background:#fff}
.search::before{content:"\1F50D";position:absolute;left:11px;top:50%;transform:translateY(-50%);
  font-size:13px;opacity:.55}
.layout{display:flex;align-items:flex-start;gap:0}
aside{width:220px;flex:0 0 220px;position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto;
  padding:14px 10px;border-right:1px solid var(--line);background:var(--panel)}
aside .sec{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:8px;
  cursor:pointer;font-size:14px;color:#333}
aside .sec:hover{background:var(--chip)}
aside .sec.on{background:var(--brand);color:#fff}
aside .sec.on .n{color:#fff}
aside .sec .n{color:var(--muted);font-size:12px}
aside .sec.pin{font-weight:700;color:var(--gold);border:1px solid #f0e2bd;background:#fdf8ec;margin-bottom:6px}
aside .sec.pin.on{background:var(--gold);color:#fff;border-color:var(--gold)}
aside hr{border:0;border-top:1px solid var(--line);margin:8px 4px}
main{flex:1;padding:18px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;
  cursor:pointer;transition:.15s;display:flex;flex-direction:column;position:relative}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.09);border-color:#d5d8dc}
.card.pin-on{border-color:#e8d49a}
.photo{height:230px;background:linear-gradient(135deg,#eceff1,#dfe3e7);position:relative;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;object-position:center 22%;display:block}
.ini{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:52px;color:#fff;background:linear-gradient(135deg,#c0392b,#e07a5f)}
.ini.gray{background:linear-gradient(135deg,#9aa4ad,#c3cbd2)}
.star{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;
  background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:14px;box-shadow:0 1px 5px rgba(0,0,0,.28)}
.card .body{padding:11px 13px 14px}
.card .name{font-size:16px;font-weight:600}
.chip{display:inline-block;margin-top:6px;padding:2px 8px;border-radius:20px;background:var(--chip);
  color:#5b636d;font-size:12px}
.card .date{margin-top:6px;color:var(--muted);font-size:12px}
.empty{padding:60px;text-align:center;color:var(--muted)}
.mask{position:fixed;inset:0;background:rgba(20,24,30,.55);display:none;z-index:50;
  align-items:center;justify-content:center;padding:20px}
.mask.on{display:flex}
.modal{background:#fff;border-radius:14px;max-width:820px;width:100%;max-height:88vh;overflow:auto;
  display:flex;flex-direction:column;position:relative}
.modal .mhead{display:flex;gap:18px;padding:20px 22px 0}
.modal .mpic{width:150px;height:190px;flex:0 0 150px;border-radius:10px;overflow:hidden;background:#eee}
.modal .mpic img{width:100%;height:100%;object-fit:cover;object-position:center 20%}
.modal h2{margin:0 0 6px;font-size:22px}
.modal .meta{color:var(--muted);font-size:13px;margin-bottom:10px}
.modal .txt{padding:6px 22px 24px;white-space:pre-wrap;font-size:15px;text-indent:2em}
.modal .txt p{margin:0 0 10px}
.x{position:absolute;right:16px;top:12px;font-size:26px;color:#9aa0a6;cursor:pointer;border:0;background:none}
.modal .bar{display:flex;justify-content:space-between;padding:4px 22px 18px;gap:10px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 14px;cursor:pointer;font-size:14px}
.btn:hover{background:var(--chip)}
.btn[disabled]{opacity:.4;cursor:default}
.note{padding:20px 22px 26px;color:var(--muted)}
@media(max-width:720px){
  aside{display:none}
  .modal .mhead{flex-direction:column}
  .modal .mpic{width:120px;height:150px;flex:0 0 auto}
}
</style>
</head>
<body>
<header>
  <h1>信息技术与工程学院 · <b>教师简历</b></h1>
  <span class="count" id="count"></span>
  <div class="search"><input id="q" type="search" placeholder="搜索姓名 / 简介关键词…"></div>
</header>
<div class="layout">
  <aside id="side"></aside>
  <main><div class="grid" id="grid"></div><div class="empty" id="empty" style="display:none">没有匹配的老师</div></main>
</div>

<script>
const DATA = [{"section": "教学名师", "name": "杨强", "date": "2026-05-06", "url": "https://site.gcc.edu.cn/xydw/jxms/4d7a18efeed74a818143489bdeb94165.htm", "text": "杨强，博士、副教授、研究生导师，现任信息技术与工程学院院长，主要研究方向涵盖大数据、人工智能、信息综合处理与辅助决策领域，系军中优秀中青年专家。曾任企业总经理及多校研究生导师。主持国家和军队科研项目20余项，获得国家科学技术进步奖二等奖1项，发表高水平论文60余篇，授权发明专利3项，，荣立个人三等功及优秀党员等多项荣誉。", "images": ["教学名师/杨强.jpg"], "_n": "杨强", "mentor": true}, {"section": "教学名师", "name": "余华", "date": "2026-05-06", "url": "https://site.gcc.edu.cn/xydw/jxms/a6f4c5e7753940d4b348d30d164eb33b.htm", "text": "余华，教授，工学博士，共产党员，硕士研究生指导教师，广东省计算机学会大数据专业委员会委员，湖北省自动化学会理事，武汉市自动化学会理事，中国武汉（南方十一省）电工理论学会理事。研究方向：大数据与云计算、人工智能等。本科毕业于国防科学技术大学，硕士、博士毕业于海军工程大学。多次荣获国家级教学技能竞赛二等奖，主持纵向和横向项目20余项，发表学术论文123篇，授权国家实用新型专利35项。", "images": ["教学名师/余华.jpg"], "_n": "余华", "mentor": true}, {"section": "教学名师", "name": "韩来权", "date": "2026-05-06", "url": "https://site.gcc.edu.cn/xydw/jxms/ec2887af73f34f0991d487bd2800c9be.htm", "text": "韩来权，博士，教授，硕士生导师。1977年生，本科、硕士、博士、博士后均毕业于东北大学。主要从事智慧心理、未来网络、云计算、深度学习、物联网等方向的科研和人才培养工作。曾在东北大学任教23年，在企业从事博士后研究工作2年。获得省科技进步奖、省教学成果奖各1项。发表学术论文40余篇；专利10余项，横纵向课题50余个；教师竞赛获奖10余项；获国家级、省级学科竞赛奖20余项。是CCF互联网专委、计算机学会会员、全国职业技能竞赛网络赛道裁判。", "images": ["教学名师/韩来权.jpg"], "_n": "韩来权", "mentor": true}, {"section": "教学名师", "name": "李蓉", "date": "2026-05-06", "url": "https://site.gcc.edu.cn/xydw/jxms/f5f00777e1e6436fb0e924d42f7ac645.htm", "text": "李蓉，教授。1998年毕业于东北大学计算机及应用专业，现任信息技术与工程学院计算机基础教研室主任。主要研究方向涵盖数据安全、隐私保护、图像处理、模式识别及深度学习技术应用。在教学与科研工作中，李蓉教授秉持“以技术创新驱动教育，以工程实践培育人才”的理念，积极推进计算机基础教育改革。近年来，发表高质量论文20余篇（含SCI论文3篇），主持或参与省级科研项目8项及校级课题10余项。其教学成果显著，曾获校级教学成果奖一等奖1项、二等奖1项，以及省计算机学会教学成果三等奖2项。此外，注重产学研融合，多次指导学生斩获国家级计算机设计大赛奖项，是一位兼具深厚学术造诣与卓越教学能力的骨干教师。", "images": ["教学名师/李蓉.jpg"], "_n": "李蓉", "mentor": true}, {"section": "教学名师", "name": "柳革命", "date": "2026-05-06", "url": "https://site.gcc.edu.cn/xydw/jxms/48413b05326c4ec0ad0a2b962f81dcb4.htm", "text": "柳革命，博士，教授。原空军工程大学军校教师，电子信息类专业教学20年，治学严谨、认真负责。从事信号处理及模式识别方向研究，参与国家某型导弹系统研制、参与一项国防设备预研项目、参与一项国家自然基金面上项目、主持两项陕西省实验室研究项目、主持一项广州市科学技术局研究项目。第一作者发表学术论文16篇，授权发明专利1项。2015年获军队三等功，2020年获广东白云学院“科研工作先进个人”，2024年获广州商学院“教学优秀奖”。", "images": ["教学名师/柳革命.jpg"], "_n": "柳革命", "mentor": true}, {"section": "教学名师", "name": "邱明辉", "date": "2026-05-06", "url": "https://site.gcc.edu.cn/xydw/jxms/d38f42f1d08e4ac9ac785c878bc66ac2.htm", "text": "邱明辉，博士，教授，广东省计算机学会理事、广东省农村科技特派员，主要从事信息查询、用户体验、信息资源开发与利用等方面研究，曾主持或参与国家、部、省级科研项目15项，出版著作3部，发表学术论文50多篇，其中被人大复印报刊资料全文转载7篇，个人获得军队、海军级奖励8项，指导学生获得省级以上奖励10余项。", "images": ["教学名师/邱明辉.jpg"], "_n": "邱明辉", "mentor": true}, {"section": "教学名师", "name": "叶丽珠", "date": "2026-05-06", "url": "https://site.gcc.edu.cn/xydw/jxms/db52d8c9a2a64415a029b00e0f455a6f.htm", "text": "叶丽珠，教授，现任大数据技术与工程系系主任、数据科学与大数据技术专业负责任，广东省大数据专委会委员，广州商学院学术委员会委员。研究方向为数据挖掘、大数据与人工智能应用。主持教科研项目20余项，主编教材12部，发表论文20余篇，获省科技进步奖二等奖1项及软著与专利4项。个人获评广东省民办高校“优秀教师”等荣誉18项，指导学生学科竞赛获国家级、省级奖项25项。", "images": ["教学名师/叶丽珠.jpg"], "_n": "叶丽珠", "mentor": true}, {"section": "教学名师", "name": "修位蓉", "date": "2026-05-06", "url": "https://site.gcc.edu.cn/xydw/jxms/54c3d26a0cfb4a6fadca8b30f6be6bc8.htm", "text": "修位蓉，教授，硕士生导师，国家二级心理咨询师，中国计算机学会会员，广东省计算机高级考评员，广东省计算机学会大数据专委会委员，广州商学院知识工程与先进计算研究院院长，华南师范大学访问学者。现任广州商学院信息技术与工程学院计算机科学与工程系主任，计算机科学与技术专业负责人，“双师双能”型教师。主讲《数据结构》《计算机组成原理》《人工智能基础》等多门课程；在国内外重要刊物上发表论文30余篇，主持和参与多项省级以上教科研项目。", "images": ["教学名师/修位蓉.jpg"], "_n": "修位蓉", "mentor": true}, {"section": "教学名师", "name": "刘国福", "date": "2026-05-06", "url": "https://site.gcc.edu.cn/xydw/jxms/5457d0001ff54d9fb83fa131d76d2803.htm", "text": "刘国福，博士，正高级工程师，硕士生导师，英国兰卡斯特大学访问学者，本硕毕业于西安交通大学。主要研究领域为精确感知技术。主持/参与国家自然科学基金项目在内的省部级以上项目10余项，发表论文60余篇，其中SCI/EI收录25篇，授权发明专利10项，获发明创业奖创新奖二等奖1次，获省优秀硕士论文指导教师奖1次。主持/参与教学研究项目6项，编著教材6本，获军队教学育才奖银奖1次，获校教学一等奖1次，校教学二等奖1次。立三等功1次。", "images": ["教学名师/刘国福.jpg"], "_n": "刘国福", "mentor": true}, {"section": "教学名师", "name": "黄世奇", "date": "2026-05-06", "url": "https://site.gcc.edu.cn/xydw/jxms/ca21de921239429d8a693a28f7a95213.htm", "text": "现为广州商学院老师，人工智能学科负责人。研究方向：图像处理、模式识别、人工智能。发表论文180余篇，SCI收录30多篇，EI收录70多篇；学术专著4部。授权国防发明专利2项、国家发明专利15项，主持项目18项，获各种奖项30余项。获陕西省第九届青年科技奖荣誉称号。兼任广东省大数据专业委员会委员、广东省人工智能协会专家、广东省计算机学会理事、国家自然科学基金委通讯评审专家等。", "images": ["教学名师/黄世奇.jpg"], "_n": "黄世奇", "mentor": true}, {"section": "学院办公室", "name": "李瑜    老师", "date": "2023-11-29", "url": "https://site.gcc.edu.cn/xydw/xybgs4/5ebf3e011b1a4db3afd30f8f6b26a682.htm", "text": "李瑜，2004年毕业于黄冈师范学院教育技术专业，2011年取得山东科技大学计算机科学与技术专业方向硕士学位，2005年至2011年供职于青岛滨海学院，2011年8月至今担任广州商学院信息技术与工程学院教务员，主要负责学院各年级专业课程的日常教务管理、学生日常成绩问题处理、安排考试等工作。", "images": ["学院办公室/李瑜    老师.jpg"], "_n": "李瑜", "mentor": true}, {"section": "学院办公室", "name": "莫健婷    老师", "date": "2023-11-29", "url": "https://site.gcc.edu.cn/xydw/xybgs4/dc2d73e7d8434f1da5ab9be7748f7915.htm", "text": "莫健婷，信息技术与工程学院教务员，现负责毕业班毕业实习、毕业论文、毕业审核等工作。在2021-2022学年度荣获教师节“优秀管理奖”。", "images": ["学院办公室/莫健婷    老师.jpg"], "_n": "莫健婷", "mentor": false}, {"section": "学院办公室", "name": "麦紫婷    老师", "date": "2023-11-29", "url": "https://site.gcc.edu.cn/xydw/xybgs4/8cefc54ff74541cab80a9aa7c641e574.htm", "text": "麦紫婷，女，负责信息技术与工程学院教务员工作。2022.8至今负责信息技术与工程学院专业课管理，学生学籍问题管理等教学工作，保障教学任务顺利开展。在2022-2023学年第二学期学期被评为“工会优秀会员”。平时工作以确保教学安排正常实施，提升教学质量及服务师生为首要宗旨。", "images": ["学院办公室/麦紫婷    老师.jpg"], "_n": "麦紫婷", "mentor": false}, {"section": "学院办公室", "name": "龚瑞娟    老师", "date": "2023-11-29", "url": "https://site.gcc.edu.cn/xydw/xybgs4/da50e60440d84dd1a0b06f7a070e7f93.htm", "text": "龚瑞娟，女，中共党员，广东惠东人，2018年加入中国共产党，2021年参加工作。现任广州商学院信息技术与工程学院教务员，主要负责校企合作、三二分段工作以及实验教学管理工作。\n\n获奖情况：\n\n1.2017年11月获得“精神文明志愿者”称号。\n\n2.2020年7月获得“优秀共产党员”奖项。\n\n3.2022-2023学年第一学期，学期绩效考核“优秀”。\n\n4.2023年4月获得“优秀工会会员”奖项。\n\n5.2023年7月被评为“结对子”工作优秀个人。", "images": ["学院办公室/龚瑞娟    老师.jpg"], "_n": "龚瑞娟", "mentor": false}, {"section": "学院办公室", "name": "陈怡    老师", "date": "2023-10-31", "url": "https://site.gcc.edu.cn/xydw/xybgs4/2f6dd62126ef44ef977f9c389290a466.htm", "text": "陈怡，女，教务员，信息技术与工程学院教务员工作，2022.8至今，负责全校公共数学，信息技术与工程学院公共选修课等教学工作，保障教学任务的顺利开展，在2022-2023学年第二学期考核中被评为“优秀”。平时工作以为教学服务，为师生服务，提高教学质量为宗旨，认真做好各项教务工作。", "images": ["学院办公室/陈怡    老师.jpg"], "_n": "陈怡", "mentor": false}, {"section": "学院办公室", "name": "李瑜　老师", "date": "2013-05-08", "url": "https://site.gcc.edu.cn/xydw/xybgs4/ca19ac0a6b234fdf942b0ee06392a61c.htm", "text": "李瑜，女，计算机系教务员。2004年毕业于黄冈师范学院教育技术专业，2011年取得山东科技大学计算机科学与技术专业方向硕士学位，2005年至2011年供职于青岛滨海学院，2011年8月至今在华南师范大学增城学院担任教务员，主要负责计算机系各年级专业课程的日常教务管理、学生日常成绩问题处理、排课、安排考试等工作。", "images": ["学院办公室/李瑜　老师.jpg"], "_n": "李瑜", "mentor": true}, {"section": "学院办公室", "name": "徐美霞 老师", "date": "2010-10-09", "url": "https://site.gcc.edu.cn/xydw/xybgs4/13e56065556a43d6a4e718d40dc07a51.htm", "text": "徐美霞，女，助理研究员。负责信息技术与工程学院教务员工作。\n\n论文发表情况：\n高校教务管理信息化建设现状及对策思考      独立完成 2017年5月 科技经济导刊\n云平台下基于RAC技术的教务系统研究与优化 第一作者      2017年7月 现代计算机\n\n获奖情况：\n1、2010年度，被学校评为优秀教务员；\n2、2011年度，被学院评为优秀教务员；\n3、2014年度，被学院评为优秀兼职档案员；\n4、2014-2015学年度第一学期，学期绩效考核“优秀”；\n5、2015-2016学年度第二学期，学期绩效考核“优秀”；\n6、2016-2017学年度第二学期，学期绩效考核“优秀”；\n7、2019-2020学年度第一学期，学期绩效考核“优秀”。", "images": ["学院办公室/徐美霞 老师.jpg"], "_n": "徐美霞", "mentor": false}, {"section": "学生工作办公室", "name": "廖琪 老师", "date": "2021-01-15", "url": "https://site.gcc.edu.cn/xydw/xsgzbgs/729ec78cef994feeba863aa67fe31a9d.htm", "text": "廖琪，女，中共党员，研究生学历，2018年7月参加工作。现任信息技术与工程学院2023级辅导员，分管学生奖助贷工作。曾获广东高校学生工作优秀案例二等奖、三等奖各一项，广东高校思想政治工作优秀论文三等奖两项，校“优秀党务工作者”、“优秀新闻宣传工作者”称号。", "images": ["学生工作办公室/廖琪 老师.jpg"], "_n": "廖琪", "mentor": false}, {"section": "学生工作办公室", "name": "胡舒娅 老师", "date": "2021-01-14", "url": "https://site.gcc.edu.cn/xydw/xsgzbgs/bffea1a1f06b42328b0d898d1f77f5e6.htm", "text": "胡舒娅，女，中共党员，江西上饶人，2020年6月加入中国共产党，2021年2月参加工作，现任广州商学院信息技术与工程学院2025级辅导员，信息技术与工程学院学生会指导老师，团委副书记。", "images": ["学生工作办公室/胡舒娅 老师.jpg"], "_n": "胡舒娅", "mentor": false}, {"section": "学生工作办公室", "name": "陈小蕾 老师", "date": "2021-01-14", "url": "https://site.gcc.edu.cn/xydw/xsgzbgs/ee10d570b9694efe851fd97ad61452cb.htm", "text": "陈小蕾，女，中共党员，2015年5月加入中国共产党，2018年参加工作，现任广州商学院信息技术与工程学院2024级辅导员。", "images": ["学生工作办公室/陈小蕾 老师.jpg"], "_n": "陈小蕾", "mentor": false}, {"section": "学生工作办公室", "name": "甘志健 老师", "date": "2021-01-14", "url": "https://site.gcc.edu.cn/xydw/xsgzbgs/cf79a7632d964ab1b1a6cf6d227b218c.htm", "text": "甘志健，男，中共党员，广东广州人，2019年6月加入 te.gcc.edu.cn/xydw/xsgzbgs/fc79e43e2cab4a66ac16f23777b9e75f.htm", "text": "许碧瑜，女，硕士研究生，中共预备党员，2025年6月加入中国共产党，工龄3年。现任信息技术与工程学院2025级辅导员，分管学院心理健康教育工作。", "images": ["学生工作办公室/许碧瑜老师.jpg"], "_n": "许碧瑜", "mentor": false}, {"section": "学生工作办公室", "name": "黄栩霈老师", "date": "2025-09-07", "url": "https://site.gcc.edu.cn/xydw/xsgzbgs/640d91e162bc4c90a1377ff4305b3cba.htm", "text": "黄栩霈，男，中共党员，毕业于华南农业大学，2024年12月加入中国共产党，2025年9月参加工作，现任信息技术与工程学院2023级辅导员，兼任学院通讯员。", "images": ["学生工作办公室/黄栩霈老师.jpg"], "_n": "黄栩霈", "mentor": false}, {"section": "学生工作办公室", "name": "刘丽洁老师", "date": "2025-09-07", "url": "https://site.gcc.edu.cn/xydw/xsgzbgs/d4e40a1387b748048fe1c6766f7ad666.htm", "text": "刘丽洁，女，硕士研究生，中共党员，2021年11月加入中国共产党，2025年7月参加工作。现任信息技术与工程学院2024级辅导员。", "images": ["学生工作办公室/刘丽洁老师.jpg"], "_n": "刘丽洁", "mentor": false}, {"section": "学生工作办公室", "name": "刘淑文 老师", "date": "2025-02-26", "url": "https://site.gcc.edu.cn/xydw/xsgzbgs/3950dbee85ba45f997b31017e6c106ff.htm", "text": "刘淑文，女，中共党员，硕士研究生，广东广州人，2023年5月加入中国共产党，2024年9月参加工作。现任信息技术与工程学院2023级辅导员，兼任广州商学院信息技术与工程学院学生第四党支部书记。", "images": ["学生工作办公室/刘淑文 老师.jpg"], "_n": "刘淑文", "mentor": false}, {"section": "学生工作办公室", "name": "杜嘉惠 老师", "date": "2025-02-26", "url": "https://site.gcc.edu.cn/xydw/xsgzbgs/eb43c3c4fec646ed9ef092d2caad53d1.htm", "text": "杜嘉惠，女，中共党员，硕士研究生，广东肇庆人，2018年11月加入中国共产党，2022年7月参加工作。现任信息技术与工程学院2022级辅导员。", "images": ["学生工作办公室/杜嘉惠 老师.jpg"], "_n": "杜嘉惠", "mentor": false}, {"section": "学生工作办公室", "name": "朱家莹老师", "date": "2025-02-26", "url": "https://site.gcc.edu.cn/xydw/xsgzbgs/c9f0fbe32555434cb41e57cd19cc1997.htm", "text": "朱家莹，女，硕士研究生，中共党员，2019年11月加入中国共产党，2024年9月参加工作。现任信息技术与工程学院辅导员、e行动-志愿服务队指导老师、学生第三党支部书记。", "images": ["学生工作办公室/朱家莹老师.jpg"], "_n": "朱家莹", "mentor": false}, {"section": "学生工作办公室", "name": "韦梓珩 老师", "date": "2023-11-30", "url": "https://site.gcc.edu.cn/xydw/xsgzbgs/617b091123b34455a530dce98dfd3a1b.htm", "text": "韦梓珩，男，中共党员，硕士研究生学历，2019年参加工作，现任广州商学院信息技术与工程学院2025级辅导员，负责学院“一站式”学生社区建设工作。", "images": ["学生工作办公室/韦梓珩 老师.jpg"], "_n": "韦梓珩", "mentor": false}, {"section": "实验室办公室", "name": "实验室人员简介——刘海翎", "date": "2023-12-11", "url": "https://site.gcc.edu.cn/xydw/sysbgs/4859de00502d4f1bb182a41d519546c1.htm", "text": "刘海翎，女，广东广州人，广州商学院数据科学与大数据技术本科生。华为大数据hcip工程师。\n\n现任广州商学院信息技术与工程学院实验员，负责资产采购和报销、负责机房管理与多媒体设备维护，保证服务器和网络设备的正常运行、安装和配置各类课程软件、实验室安全管理等工作。", "images": ["实验室办公室/实验室人员简介——刘海翎.jpg"], "_n": "刘海翎", "mentor": true}, {"section": "实验室办公室", "name": "实验室人员简介——吴凡", "date": "2023-10-14", "url": "https://site.gcc.edu.cn/xydw/sysbgs/cf5ce5635a8a409e9f13a52d3d192c04.htm", "text": "吴凡，男，群众，安徽宣城人，广州商学院电子信息科学与技术本科生。系统集成项目管理工程师。\n\n现任广州商学院信息技术与工程学院实验员。主要负责机房管理与维护、课程软件安装、实验室日常安全管理工作。同时在教学方面担任计算机网络技术课程实验助教。", "images": ["实验室办公室/实验室人员简介——吴凡.jpg"], "_n": "吴凡", "mentor": true}, {"section": "实验室办公室", "name": "实验室人员简介——石世宜", "date": "2023-10-14", "url": "https://site.gcc.edu.cn/xydw/sysbgs/5b0ff5f0bc4a4286acbf788837eb0131.htm", "text": "石世宜，男，助理实验师，广东湛江人，1998年8月出生，广州商学院计算机科学与技术本科生。计算机技术与软件资格中级工程师（网络工程师），华为数通网络工程师，项目管理专业人士资格认证（PMP认证）。\n\n现任广州商学院信息技术与工程学院实验员，负责机房管理与维护、课程软件安装、实验室安全管理等工作，在教学方面担任计算机网络技术指导老师。", "images": ["实验室办公室/实验室人员简介——石世宜.jpg"], "_n": "石世宜", "mentor": true}, {"section": "实验室办公室", "name": "实验室人员简介——梁泳辉", "date": "2023-10-14", "url": "https://site.gcc.edu.cn/xydw/sysbgs/b529d7c80f294666a4bbce77b4846020.htm", "text": "梁泳辉，男，广东肇庆人，1998年出生，信息技术与工程学院实验员。2019.9-2022.6学生期间担任多媒体课室管理实习生，负责协助上课设备维护，解决上课期间设备突发问题，保障教学任务的顺利开展；2022.8至今，信息技术与工程学院实验员，负责实验室机房管理、机房建设、实验室安全管理、协助老师上课等工作。热爱工作方面：计算机网络技术、计算机应用、操作系统。", "images": ["实验室办公室/实验室人员简介——梁泳辉.jpg"], "_n": "梁泳辉", "mentor": true}, {"section": "实验室办公室", "name": "实验室人员简介——梁盛", "date": "2023-10-14", "url": "https://site.gcc.edu.cn/xydw/sysbgs/78c5e253b86f4619a8d0b7d9a148b5cf.htm", "text": "梁盛，男，实验师，网络工程师，信息系统项目管理师。负责嵌入式系统应用实验室、单片机设计实验室、网络工程实验室等实验室的建设、管理与维护。先后在期刊上发表过论文《交通灯控制实验的改进》、《浅谈高校嵌入式实验室的管理》、《虚拟机VMware在网络实验教学中的应用》、《计算机网络实验教学中VLAN实验的设计研究》。", "images": ["实验室办公室/实验室人员简介——梁盛.jpg"], "_n": "梁盛", "mentor": true}, {"section": "计算机科学与工程系", "name": "叶晟", "date": "2026-04-27", "url": "https://site.gcc.edu.cn/xydw/jsjkxygcx1/wljsygcjys1/c7e07c4b47bf4a5a8c3513e175c4c628.htm", "text": "叶晟，副教授，信息系统项目管理师、多媒体应用设计师、国家二级企业培训师、三级人工智能训练师，中国计算机学会会员，现任信息技术与工程学院网络技术教研室主任，I类骨干教师，“双师双能型”教师。\n\n长期从事计算机类专业教学、科研与专业建设工作，主讲《计算机网络技术》、《Linux操作系统与应用》、《网络信息安全概论》等多门课程，教学经验丰富。主持和参与多项教科研项目，在国内外重要刊物上发表论文20余篇，主编及参编教材4部，国际专利及软件著作权多项，主要研究方向为通信信号覆盖优化、数字媒体技术与网络操作系统教学改革等，在相关领域持续开展教学与科研工作。", "images": ["计算机科学与工程系/叶晟.jpg"], "_n": "叶晟", "mentor": true}, {"section": "计算机科学与工程系", "name": "邹秀芳", "date": "2026-04-27", "url": "https://site.gcc.edu.cn/xydw/jsjkxygcx1/wljsygcjys1/fdfd729dc89f4404bf2e20f0098d4734.htm", "text": "邹秀芳，硕士毕业于华南师范大学。拥有多年高校教学经验，长期担任《计算机组成原理》、《移动软件开发》等课程教学，教授过《web应用开发》、《鸿蒙北向应用入门》等课程。主要研究方向为人工智能应用、图像处理、目标识别等。获得2024-2025学年优秀教学奖。", "images": ["计算机科学与工程系/邹秀芳.jpg"], "_n": "邹秀芳", "mentor": true}, {"section": "计算机科学与工程系", "name": "罗肖辉", "date": "2026-04-27", "url": "https://site.gcc.edu.cn/xydw/jsjkxygcx1/wljsygcjys1/ddc5b6112dcf401a929547cc3ef5c6e8.htm", "text": "罗肖辉，硕士，副教授、高级实验师，“双师双能型”教师。2004年本科毕业于华南师范大学教育技术学专业，2008年于华南理工大学软件工程专业获得硕士学位，分别于2019年、2024年通过高级实验师、副教授职称评审。2004年9月至2025年8月，在广州商学院信息化建设处部门负责网络规划建设、网络安全运维、数据中心云平台管理等工作，期间从事《计算机网络技术》《信息安全管理》《防火墙技术》《云计算应用技术》《云技术开发》《云存储技术》等课程的教学。2025年9月转为专任教师。公开发表学术论文8篇，主持和参与的省市级科研项目共6项，获得服务育人标兵、优秀共产党员、园区优秀教辅奖、年终考核优秀等奖励。", "images": ["计算机科学与工程系/罗肖辉.jpg"], "_n": "罗肖辉", "mentor": true}, {"section": "计算机科学与工程系", "name": "罗健", "date": "2026-04-27", "url": "https://site.gcc.edu.cn/xydw/jsjkxygcx1/wljsygcjys1/2cfb4fd80ad4471ebdb52d17db94a796.htm", "text": ".\n\n罗健。华中科技大学系统分析与集成专业硕士，学位武汉大学计算机科学与技术专业学士学位，拥有19年信息与通信技术（ICT）行业从业经验，先后任职于北电网络、中兴通讯、爱立信等全球知名企业，积累了深厚的技术研发背景与丰富的项目实战能力。\n\n科研方面，作为全球移动通信系统协会（GSMA）技术小组成员，以第一发明人身份获得两项通信行业授权专利。主导并联合苹果、三星、谷歌等国际头部企业合作制定移动设备技术规范，相应解决方案已在全球多个运营商网络中规模部署，具备突出的技术创新与成果转化能力。具备产教融合能力，擅长将企业研发、管理与标准化经验系统化融入教学，注重学生工程思维与职业素养培养。", "images": ["计算机科学与工程系/罗健.jpg"], "_n": "罗健", "mentor": true}, {"section": "计算机科学与工程系", "name": "胡明霞", "date": "2026-04-27", "url": "https://site.gcc.edu.cn/xydw/jsjkxygcx1/wljsygcjys1/10e19ea8ef2c49b39ae316e01660765c.htm", "text": "基本信息\n\n性别：女\n\n- 职称：校聘副教授\n\n- 教研室：计算机科学与技术教研室\n\n- 毕业院校：华中科技大学软件学院\n\n社会兼职\n\n- 广州市中级专业技术资格评审委员会 评审委员\n\n荣誉称号\n\n- 园区优秀教师职工\n\n- “华为网院杯”全国大学生ICT技能大赛 优秀指导老师\n\n- “中星杯”网络攻防大赛 优秀指导老师\n\n教学方向\n\n主讲：计算机网络、路由交换技术、网络规划与设计、局域网组网、网络管理、网络信息安全\n\n熟悉：Cisco、华为主流设备\n\n科研成果\n\n- 发表论文 6篇（含 2篇核心期刊）\n\n- 主编/参编教材 5部\n\n- 参与校级质量工程项目：\n\n《蓝盾信息安全技术股份有限公司网络工程专业大学生校外实践教学基地》", "images": ["计算机科学与工程系/胡明霞.jpg"], "_n": "胡明霞", "mentor": true}, {"section": "计算机科学与工程系", "name": "何吕君", "date": "2026-04-27", "url": "https://site.gcc.edu.cn/xydw/jsjkxygcx1/wljsygcjys1/c077bd69344645c5b6b3012a8746bb6d.htm", "text": "湘潭大学 工程硕士 控制工程 2011-2014\n\n湘潭大学 工学学士 建筑设施与智能技术 2007-2011\n\n研究领域：机器学习、数据挖掘与嵌入式系统\n\n主讲课程：Linux操作系统与应用、鸿蒙南向设备开发、面向对象程序设计、概率论等\n\n科研成果：参与编著教材《Linux操作系统与应用项目化教程》，发表《Exploration and Practice of Blended Online-Offline Teaching Combined with PBL in the Course of Linux Operating System Application》、《基于UMAP-KNN的分类算法研究》等论文", "images": ["计算机科学与工程系/何吕君.jpg"], "_n": "何吕君", "mentor": true}, {"section": "计算机系统与专业基础教研室", "name": "任燕", "date": "2026-04-28", "url": "https://site.gcc.edu.cn/xydw/jsjkxygcx1/jsjxtyzyjcjys1/b3085654b1f744bba27732b59af9d51d.htm", "text": "任燕，女，1991年生，硕士研究生学历，现任信息技术与工程学院计算机科学与技术系专任教师。\n\n2021年毕业于广东工业大学控制工程专业，获工学硕士学位。2022年9月入职本校，从事教学与科研工作至今。主要承担《操作系统》《鸿蒙应用北向开发基础》《Unity-VR虚拟现实游戏开发》《程序设计基础》等课程教学。指导学生参加中国计算机设计大赛获省级二等奖1项、全国青年科普创新实验作品大赛校赛二等奖1项，开放原子大赛三等奖2项。参与学院学科竞赛指导工作。\n\n科研方向为元宇宙、国产操作系统生态研究。参与国家自然科学基金项目1项；以第一作者发表期刊论文2篇；获专利1项。社会服务技能方面，担任人工智能训练师（高级）。", "images": ["计算机系统与专业基础教研室/任燕.jpg"], "_n": "任燕", "mentor": true}, {"section": "计算机系统与专业基础教研室", "name": "黄育钊", "date": "2026-04-28", "url": "https://site.gcc.edu.cn/xydw/jsjkxygcx1/jsjxtyzyjcjys1/4efe1a3d68f24182898356a5e7185233.htm", "text": "黄育钊，中共党员，硕士研究生。2014年获广东工业大学计算机科学与技术学士学位，2017年获中山大学计算机技术硕士学位。主讲过《计算机应用基础》、《人工智能通识基础》等课程。拥有8年互联网行业从业经验，曾在网易、中移互联网等企业任职，具备丰富的软件项目策划与开发实践经验。主要研究方向为人工智能领域的智能计算、LLM智能体、多智能体协作，关注人工智能技术在教学场景中的融合应用。", "images": ["计算机系统与专业基础教研室/黄育钊.jpg"], "_n": "黄育钊", "mentor": true}, {"section": "计算机系统与专业基础教研室", "name": "黄福春", "date": "2026-04-28", "url": "https://site.gcc.edu.cn/xydw/jsjkxygcx1/jsjxtyzyjcjys1/fb75ce1ab4a14432936f1c2aefd8fdcc.htm", "text": "黄福春，男，博士，毕业于中山大学。主要研究方向包括物联网技术、下一代无线通信技术以及人工智能技术。本人已撰写学术论文20余篇，其中多篇被SCI、EI收录，代表性论文发表于《IEEE Transaction on Communications》，《IEEE Wireless Communications Letters》，《IEEE Communications Letters》等期刊；主持多项科研项目以及申请多项发明专利；主讲课程：线性代数、信号与系统。", "images": ["计算机系统与专业基础教研室/黄福春.jpg"], "_n": "黄福春", "mentor": true}, {"section": "计算机系统与专业基础教研室", "name": "白恩慈", "date": "2026-04-28", "url": "https://site.gcc.edu.cn/xydw/jsjkxygcx1/jsjxtyzyjcjys1/7b65b1ae0f7245ff863ec1fb34f8c5f7.htm", "text": "白恩慈，博士毕业于哈尔滨工业大学计算机科学与技术专业。主要从事于实时计算和实时任务调度等方面的研究，参与了国家自然基金面上项目“，嵌入式系统实时任务调度算法与可调度性分析理论研究”，排名第二；参与了国家重点研发计划项目子课题“，大规模高逼真目标网络快速灵活构建”；参与了深圳市科技计划基础研究面上项目“面向多核实时系统的任务调度算法研究”等科研项目，在国际顶级期刊《IEEE Transactions on Industrial Informatics》（中科院一区 (TOP) ）及国内计算机领域顶级核心期刊《软件学报》（中国计算机学会推荐 A 类期刊）等国内外高水平学术期刊上发表了五篇论文。", "images": ["计算机系统与专业基础教研室/白恩慈.jpg"], "_n": "白恩慈", "mentor": true}, {"section": "计算机系统与专业基础教研室", "name": "蒋文杰", "date": "2026-04-28", "url": "https://site.gcc.edu.cn/xydw/jsjkxygcx1/jsjxtyzyjcjys1/e762ef39dfd14070a41ad8b1524d16a2.htm", "text": "蒋文杰，硕士，毕业于广西师范大学电子与通信工程专业。主要从事人工智能、计算机视觉与智能信息处理等方向研究，围绕生成对抗网络、图像超分辨率重建、MRI重建及行人重识别等开展了较为系统的科研工作。已发表核心期刊论文3篇，另有多篇学术论文录用或发表，获多项专利授权。", "images": ["计算机系统与专业基础教研室/蒋文杰.jpg"], "_n": "蒋文杰", "mentor": true}, {"section": "计算机系统与专业基础教研室", "name": "张欧亚", "date": "2026-04-28", "url": "https://site.gcc.edu.cn/xydw/jsjkxygcx1/jsjxtyzyjcjys1/088ae72e261b4ebab091bba0cd471e5b.htm", "text": "张欧亚，计科系计算机系统与专业基础教研室副教授，山东济宁人，1971.11出生，中共党员，博士，硕士生导师。\n\n某军校自动控制系测控工程专业本科（1994）、测试计量技术及仪器专业硕士（1999），西北工业大学（电子信息学院）系统工程专业博士（2008）。\n\n1999-2020任教。退役后2021年入职广州商学院。\n\n曾享受军队优秀专业技术人才岗位津贴，入选军校“创新人才工程”，多次被评为优秀教员、先进个人、优秀指导教师。主持或参与完成军种（市厅）以上级科研课题30多项，获军队科技进步二、三等奖7项，军研成果奖12项。发表学术论文50多篇，其中SCI收录3篇，EI收录10篇，获奖7篇，核心期刊30多篇。获教学成果奖3项。主编或参编专著16部、教材40余部，获奖3部。", "images": ["计算机系统与专业基础教研室/张欧亚.jpg"], "_n": "张欧亚", "mentor": true}, {"section": "计算机系统与专业基础教研室", "name": "魏小英", "date": "2026-04-28", "url": "https://site.gcc.edu.cn/xydw/jsjkxygcx1/jsjxtyzyjcjys1/4cbecbeec8204b4783d91f4433730486.htm", "text": "魏小英，女，中共党员，毕业于华南理工大学，硕士研究生，计算机科学讲师，从事高校计算机应用研究与教学工作二十余年，主要承担操作系统、数据库原理与应用、程序设计等多门专业课程的教学工作，曾获广东省信息化教学大赛二等奖、广东省软件评审二等奖、广东省民办高校优秀教师、广东省软件评审活动先进个人、广东省高校资助工作先进个人、校级师德评价考核优秀个人等荣誉；在国家级、省级学术期刊发表多篇论文，编写创新创业与就业指导多本教材，指导学生参加广东省职业生涯规划大赛、职业技能大赛多次获奖。", "images": ["计算机系统与专业基础教研室/魏小英.jpg"], "_n": "魏小英", "mentor": true}, {"section": "计算机系统与专业基础教研室", "name": "韩来权", "date": "2026-04-28", "url": "https://site.gcc.edu.cn/xydw/jsjkxygcx1/jsjxtyzyjcjys1/244b5290805b4432adb05689ccd46666.htm", "text": "韩来权，博士、教授、硕士生导师。从教27年，主要从事人工智能、未来网络等方向的科研和人才培养工作。兼任CCF互联网专委、大学生创业导师、全国职业技能竞赛裁判等工作；以第一完成人获得河北省科技进步奖和河北省教学成果奖各一项。发表学术论文40余篇，包括本领域顶级期刊1篇，SCI/EI收录30余篇；承担/参与国家杰出青年基金项目、国自然、中央电教馆、省科技厅、省教育厅等40余个科研课题；申请专利17个，其中12个已获授权，包括美国/欧洲授权国际专利2项；在30多个会议做学术报告，获优秀论文奖多项；承办/协办多个国内/国际学术会议；指导学生获国家级、省二级以上奖项30余项。", "images": ["计算机系统与专业基础教研室/韩来权.jpg"], "_n": "韩来权", "mentor": true}, {"section": "计算机系统与专业基础教研室", "name": "梁元贞", "date": "2026-04-28", "url": "https://site.gcc.edu.cn/xydw/jsjkxygcx1/jsjxtyzyjcjys1/7bd58e862c1f4020aac6063a3e0e3c9a.htm", "text": "梁元贞，副教授，暨南大学计算机科学与技术专业硕士毕业， 新加坡伦敦商业金融学院完成双语教师专项教育培训，具备扎实的专业理论功底与国际化教学视野。长期深耕一线教学工作，主讲《大数据应用技术》《大数据应用技术实验》《程序设计基础》等计算机专业核心课程，同时承担《线性代数》《高等数学》等公共基础课程教学，授课覆盖面广、教学经验丰富。现担任计算机系统与专业教研室主任，统筹教研室教学管理、专业建设与师资培养等各项工作。教学实践中，注重以赛促教、以赛促学，积极指导学生参与各类学科竞赛，自身踊跃参加各级教学比拼，先后斩获课堂教学比赛一等奖、学校第七届中青年教师教学大赛优秀奖。科研方面成果扎实，发表多篇学术论文，主持及参与多项省级、校级科研与教改课题，实现教学与科研双向深耕、协同发展。", "images": ["计算机系统与专业基础教研室/梁元贞.jpg"], "_n": "梁元贞", "mentor": true}, {"section": "鸿蒙技术与生态应用教研室", "name": "祝玉杰", "date": "2026-04-28", "url": "https://site.gcc.edu.cn/xydw/jsjkxygcx1/hmjsystyyjys1/7ebb313a99774fc8b68806f9af4fbbf1.htm", "text": "祝玉杰，讲师，高级工程师。2017 年获沈阳理工大学自动化专业学士学位，2020 年获广东工业大学控制工程专业硕士学位。\n\n主要承担计算机科学与技术专业课程教学及毕业生毕业设计指导工作。发表核心期刊论文 2 篇、普通期刊论文 1 篇，获广东省计算机学会教育教学成果三等奖。\n\n长期指导学生参与蓝桥杯、大学生创新创业训练计划、广东省大学生计算机设计大赛、攀登计划等学科竞赛，取得良好成绩，注重以赛促学、着力提升学生实践创新与工程应用能力。", "images": ["鸿蒙技术与生态应用教研室/祝玉杰.jpg"], "_n": "祝玉杰", "mentor": true}, {"section": "鸿蒙技术与生态应用教研室", "name": "李利香", "date": "2026-04-28", "url": "https://site.gcc.edu.cn/xydw/jsjkxygcx1/hmjsystyyjys1/a9df822c922449fe938b258b41a1739e.htm", "text": "李利香，女，硕士，助教，主讲《模拟与数字电路》、《鸿蒙南向设备开发》、《概率论与数理统计》等课程。", "images": ["鸿蒙技术与生态应用教研室/李利香.jpg"], "_n": "李利香", "mentor": true}, {"section": "鸿蒙技术与生态应用教研室", "name": "薄喜柱", "date": "2026-04-28", "url": "https://site.gcc.edu.cn/xydw/jsjkxygcx1/hmjsystyyjys1/6587742e20a744069e232fa8fa0c61d3.htm", "text": "薄喜柱，广州商学院信息技术与工程学院教师，鸿蒙技术与生态应用教研室，鸿蒙研究院院长、华为开发者布道师，双师双能型教师。1990-1994 年山西大学计算机软件专业，理学学士；1994-1997 年哈尔滨工程大学计算机应用技术专业，工学硕士；1997-2001 年哈尔滨工业大学计算机应用技术专业，工学博士。\n\n曾任上海贝尔深研发系统工程师，在华为全球销售部 / 全球技术服务部主导与参与子公司管理与企业数字化转型项目，具备深厚产业实践经验。研究方向为多智能体系统、企业数字化转型、鸿蒙开发应用，专注鸿蒙原生智能、自动代码生成与行业解决方案研发，拥有丰富科研与工程转化能力。", "images": ["鸿蒙技术与生态应用教研室/薄喜柱.jpg"], "_n": "薄喜柱", "mentor": false}, {"section": "鸿蒙技术与生态应用教研室", "name": "肖湘萍", "date": "2026-04-28", "url": "https://site.gcc.edu.cn/xydw/jsjkxygcx1/hmjsystyyjys1/8cd00541714445d49c0eca97a1da6889.htm", "text": "肖湘萍，博士。本科毕业于南京大学，硕博就读于核工业北京地质研究院。曾担任核工业北京地质研究所工程师、多家IT企业cto，2021年就职广州商学院。曾获得部级科技进步一等奖1次；二等奖3次；多次获得核工业部青年优秀论文奖。论文有：《金刚石形成的微观解释及其保存条件》《膨润土矿床筛选,中国高放废物地质处置十年进展》《人工智能在食品安全方面的应用》", "images": ["鸿蒙技术与生态应用教研室/肖湘萍.jpg"], "_n": "肖湘萍", "mentor": true}, {"section": "鸿蒙技术与生态应用教研室", "name": "修位蓉", "date": "2026-04-28", "url": "https://site.gcc.edu.cn/xydw/jsjkxygcx1/hmjsystyyjys1/a0431aa126e54da4b5bff7d1655bc9e1.htm", "text": "修位蓉，女，博士，教授，硕士生导师，现任广州商学院信息技术与工程学院计算机科学与工程系主任，计算机科学与技术专业负责人。长期从事计算机类专业教学、科研与专业建设工作，主讲《数据结构》《计算机组成原理》《人工智能基础》等课程。主持及参与多项省级以上教科研项目，近五年发表论文30余篇，其中第一作者20余篇，涵盖SCI、EI及北大核心期刊，并获授权专利及软件著作权7项。曾获广州商学院“优秀科研奖”“优秀教学奖”，多次指导学生在蓝桥杯、数学竞赛等省级学科竞赛获奖，荣获“优秀指导教师”称号。现兼任广东省计算机学会大数据专委会委员、广东省高教学会人工智能分会理事，积极推动课程体系优化、产教融合及教学改革创新。", "images": ["鸿蒙技术与生态应用教研室/修位蓉.jpg"], "_n": "修位蓉", "mentor": true}, {"section": "鸿蒙技术与生态应用教研室", "name": "姜薇", "date": "2026-04-28", "url": "https://site.gcc.edu.cn/xydw/jsjkxygcx1/hmjsystyyjys1/3e9aa826e5d44423a2905d9fbc695d5c.htm", "text": "姜微，博士，讲师，华为开发布道师。现任信息技术与工程学院计算机科学与工程系鸿蒙技术与生态应用教研室主任。2020年入职至今，长期深耕计算机专业教学、学科科研与产教融合建设工作。科研领域，主持及参与多项省、校级教科研项目，发表高水平学术论文十余篇，承担横向课题5项，立足产业需求推进产学研协同发展。教学中主讲《鸿蒙北向开发基础》《鸿蒙北向开发高级》《大数据应用技术》等核心课程，教学功底扎实，教学考核多次获评优秀，屡获校级优秀教师荣誉。同时深耕实践育人，积极指导学生参与各类学科竞赛，助力学生专业成长，以赛促学、以赛促练，育人成果丰硕。", "images": ["鸿蒙技术与生态应用教研室/姜薇.jpg"], "_n": "姜薇", "mentor": true}, {"section": "软件工程系", "name": "李长龙", "date": "2026-04-28", "url": "https://site.gcc.edu.cn/xydw/rjgc/rjjsjcjys1/1900eb0cfc7b441c9e85bccc084ee5cf.htm", "text": "李长龙，博士，副教授，长期专注于遥感大数据分析与城市空间规划等研究，在粤港澳大湾区高温环境、碳循环和生态系统动态监测等领域具有深厚研究基础。主持省级以上科研项目7项，包括广东省自然科学基金面上项目、广东省基础与应用基础研究区域联合基金项目、广州市基础与应用基础研究专题等，累计资金超150万元。发表学术论文30余篇，包括Ecological Indicators等国际顶级期刊及地理学报等中文核心期刊。担任中国科技部-欧洲空间局“龙计划”项目中方科学家，草原资源专业委员会委员等职务。在教学与科研方面成果突出，荣获中国商业联合会全国服务业科技创新二等奖，2023年校优秀教学奖和优秀科研奖，2024年校优秀科研奖，2025年校优秀教学奖等奖励。", "images": ["软件工程系/李长龙.jpg"], "_n": "李长龙", "mentor": true}, {"section": "软件工程系", "name": "张智勇", "date": "2026-04-28", "url": "https://site.gcc.edu.cn/xydw/rjgc/rjjsjcjys1/97702e24904040cb8e147056580d5a21.htm", "text": "张智勇，2007年硕士毕业于华中科技大学计算机学院。\n\n在央企、外企、创业公司工作十多年，历任软件工程师、系统分析师、技术总监、运营总监等职。\n\n2023年加入广州商学院，目前为软件工程系软件基础教研室专任教师，主要讲授数据结构与算法等课程。", "images": ["软件工程系/张智勇.jpg"], "_n": "张智勇", "mentor": true}, {"section": "软件工程系", "name": "罗开宇", "date": "2026-04-28", "url": "https://site.gcc.edu.cn/xydw/rjgc/rjjsjcjys1/2dab23b7ed3a4b698aa065b51169d346.htm", "text": "罗开宇，1976年10月生于江西，1994年考入西北工业大学电子工程系， 2003年获西北工业大学系统工程专业硕士学位。\n\n毕业后长期在广州航新科技有限公司任职，历任技术员、部门经理、研发中心主任、副总工等职，2013年主导研发的产品曾获军队科技进步奖二等奖。\n\n2019年3月加入广州商学院信息技术与工程学院信息管理与信息系统专业就职。主要教学方向为项目管理、数据处理与挖掘、数据可视化及基础软件设计。2026年加入信息技术与工程学院软件基础教研室专业教学。", "images": ["软件工程系/罗开宇.jpg"], "_n": "罗开宇", "mentor": true}, {"section": "软件工程系", "name": "王雪芹", "date": "2026-04-28", "url": "https://site.gcc.edu.cn/xydw/rjgc/rjjsjcjys1/a657e6526c8347a5b863c8d1127f028e.htm", "text": "王雪芹  硕士研究生学历   本科阶段华中农业大学计算机科学与技术专业  硕士阶段广东外语外贸大学管理科学与工程专业，硕士期间获得国家奖学金 ，以唯一通讯作者发表SSCI一区论文2篇。", "images": ["软件工程系/王雪芹.jpg"], "_n": "王雪芹", "mentor": true}, {"section": "软件工程系", "name": "赵菊芳", "date": "2026-04-28", "url": "https://site.gcc.edu.cn/xydw/rjgc/rjjsjcjys1/3acfc04ebace45e5a2bf15f12fef176c.htm", "text": "赵菊芳，软件工程专业硕士研究生，现任信息技术与工程学院软件工程基础教研室专任教师。\n\n2015-2022年，本硕连读于辽宁工程技术大学，均系统攻读软件工程相关专业，深耕软件工程领域理论知识与专业技能研习，构建了完备的专业知识体系。\n\n自2023入职以来，深耕教学一线，主讲《程序设计基础》《离散数学》《编译原理及其应用》等专业核心课程，注重理论与工程实践相结合，聚焦学生编程能力、软件项目开发与工程化思维培养，教学风格扎实严谨。\n\n科研方向专注于软件工程领域，入职以来在专业学术期刊发表相关科研论文2篇。始终以培养高素质软件工程技术人才为目标，助力专业学科建设与学生成长成才。", "images": ["软件工程系/赵菊芳.jpg"], "_n": "赵菊芳", "mentor": true}, {"section": "软件工程系", "name": "曹慧贞", "date": "2026-04-28", "url": "https://site.gcc.edu.cn/xydw/rjgc/rjjsjcjys1/85482606204d49c48c683c48f597a896.htm", "text": "曹慧贞，女，中级软件设计师，硕士，安徽理工大学计算机技术专业硕士研究生。主要研究方向：深度学习，伪装目标检测，曾获得的部分学术成果：\n\n[1]Boundary enhancement and refinement network for camouflaged object detection[J]. Machine Vision and Applications, 2024, 35(5): 107.\n\n[2]曹慧贞，等人. 一种高鲁棒性的图像篡改检测方法.\n\n[3]曹慧贞，等人. 基于多尺度跨层特征融合网络的伪装目标检测算法.\n\n[4]曹慧贞，等人. 基于边缘细化和增强网络的伪装目标检测算法.", "images": ["软件工程系/曹慧贞.jpg"], "_n": "曹慧贞", "mentor": true}, {"section": "软件工程系", "name": "许薇", "date": "2026-04-28", "url": "https://site.gcc.edu.cn/xydw/rjgc/rjjsjcjys1/74b17ec85ba2485aa0ae22b422389649.htm", "text": "许薇，教授，硕士。长期从事计算机专业教学与研究工作，主讲《数据库原理与应用》《操作系统》《离散数学》等课程，校级线下一流课程《数据库原理与应用》负责人；广东省课程思政计算机科学与技术专业示范团队负责人；主编《离散数学》《数据库原理与应用》等教材 15 部；主持和参加省级以上教科研项目20余项。获广东省教育厅（高等教育类）教学成果二等奖、广东省高等教育评估学会教学成果一等奖、2026年优秀论文一等奖等。\n\n现任中国计算机学会终身会员、广东省计算机学会大数据专委会委员，受聘为广东省第五届高校教师创新大赛线上评委、校级教学督导，入选教育部审核评估专家库专家。", "images": ["软件工程系/许薇.jpg"], "_n": "许薇", "mentor": true}, {"section": "软件工程系", "name": "同军红", "date": "2026-04-28", "url": "https://site.gcc.edu.cn/xydw/rjgc/rjjsjcjys1/4841a4e721434ab58a172bd82237715f.htm", "text": "同军红，男，副教授、高级工程师，“双师双能”型教师。现担任软件基础教研室主任、兼任学院教学督导，一流课程《离散数学》、《程序设计基础》负责人，主编教材多部，发表论文十多篇，主持和参加省级以上教研项目10余项。近三年指导学生参加大学生数学建模竞赛、大学生数学竞赛、挑战杯等省部级以上赛事获奖达30多项以上，主要的研究方向：嵌入式系统应用及开发，人工智能，数据分析与智能决策。主讲：离散数学、程序设计基础、操作系统等课程。", "images": ["软件工程系/同军红.jpg"], "_n": "同军红", "mentor": true}, {"section": "软件系统架构教研室", "name": "赵琦", "date": "2026-04-28", "url": "https://site.gcc.edu.cn/xydw/rjgc/rjxtjgjys1/c8c5c2978701407a9a950b4e482b2618.htm", "text": "赵琦，计算机专业硕士，广州商学院专任教师。深耕计算机网络、数据分析、机器学习等领域教学，坚持以研促教、教研融合，构建理论与工程实践一体化教学体系。拥有 AI 算法研发、金融科技等跨领域实战经验，聚焦智能数据挖掘与算法优化研究。创新提出 LLFp‑Growth、SULLFp‑Growth、IULLFp‑Growth 三款高效算法，突破传统 Fp‑Growth的技术瓶颈；学术成果发表于知网，获软著、专利等知识产权。持阿里云专业认证，精通 C++、Python 及主流 AI 技术栈，兼具系统教学能力、算法研发能力与科研创新能力，致力于智能算法与数据挖掘领域的教学创新与技术突破。", "images": ["软件系统架构教研室/赵琦.jpg"], "_n": "赵琦", "mentor": true}, {"section": "软件系统架构教研室", "name": "陈代进", "date": "2026-04-28", "url": "https://site.gcc.edu.cn/xydw/rjgc/rjxtjgjys1/70a03f0fdfa64ecfb3fddd8a809797c6.htm", "text": "陈代进，中共党员，高级工程师，1996年于华中师范大学获理学学士学位，2007年于华南师范大学获教育学硕士学位。", "images": ["软件系统架构教研室/陈代进.jpg"], "_n": "陈代进", "mentor": true}, {"section": "软件系统架构教研室", "name": "王家城", "date": "2026-04-28", "url": "https://site.gcc.edu.cn/xydw/rjgc/rjxtjgjys1/9117896f6f644adf8a6efa231615d7e6.htm", "text": "王家城，博士。研究方向为现代通信技术与系统，通信信号调制与检测技术、数字信号处理技术等。硕士毕业于重庆大学应用数学专业，博士毕业于中国科学院计算数学与科学工程计算研究所。超过20年的宽带无线通信，3G/4G/5G移动通信空中接口技术研究及开发。发表科研论文9篇，授权发明专利8项。", "images": ["软件系统架构教研室/王家城.jpg"], "_n": "王家城", "mentor": true}, {"section": "软件系统架构教研室", "name": "刘志雄", "date": "2026-04-28", "url": "https://site.gcc.edu.cn/xydw/rjgc/rjxtjgjys1/45d561822267469d900711c3bc0119e1.htm", "text": "刘志雄，本科毕业，软件工程硕士学位，系统规划管理师（高级）。以1999年8月入职本校，任职于学院网络中心，专注于校园信息化建设工作。期间深度参与校园数字化体系规划、信息系统搭建与技术优化等核心任务。 2020 年 9 月起，转入广州商学院信息技术与工程学院担任专任教师，从事计算机专业教学领域。在教学工作中，始终以培养学生专业能力与实践素养为核心，主讲课程包括《Web 应用开发》、《计算机网络技术》、《计算机图像处理技术》、《Web架构应用开发》、《动态网站设计》等，涵盖网络技术、开发设计等多个核心方向，帮助学生构建完整的专业知识框架。科研领域方面，我持续聚焦Web应用开发与网络安全方向研究，于 2024 年顺利完成一项市厅级项目《校园网络安全态势感知关键技术研究》工作，为提升校园网络安全预警、系统稳定运行提供技术支撑，同时科研过程中的前沿技术与实践应用于课程教学。", "images": ["软件系统架构教研室/刘志雄.jpg"], "_n": "刘志雄", "mentor": true}, {"section": "软件系统架构教研室", "name": "杨柳清", "date": "2026-04-28", "url": "https://site.gcc.edu.cn/xydw/rjgc/rjxtjgjys1/cbd17e4f2af349b5b406505cb33432d3.htm", "text": "杨柳清，硕士，毕业于华南师范大学软件工程专业。本科毕业于重庆邮电大学信息安全专业。曾获蓝桥杯优秀指导教师，指导学生参加蓝桥杯学科竞赛，累计获省级奖项7项，其中二等奖1项、三等奖6项。", "images": ["软件系统架构教研室/杨柳清.jpg"], "_n": "杨柳清", "mentor": true}, {"section": "软件系统架构教研室", "name": "谢伟晶", "date": "2026-04-28", "url": "https://site.gcc.edu.cn/xydw/rjgc/rjxtjgjys1/42d59f4fb0894597bf74bdf842678f40.htm", "text": "谢伟晶，计算机工程硕士 ，信息技术与工程学院专任教师。研究方向包括企业级信息系统应用、Web架构应用技术、AI Agent智能体应用等。目前从事软件系统架构方向的教学与研究工作，主要承担《算法设计与分析》，《操作系统》，《Web应用开发课程实验》，《Web架构应用开发》等专业课程的教学任务。在企业工作期间，曾参与研发广州赤岗电动汽车充换电机器人系统、广州南方电力集团有限公司智能小区管理系统、黄埔社区健康档案管理平台，黄埔区智慧交通指挥系统等信息化项目，具备工程实践经验。教学中注重理论与实践相结合，善于将企业项目案例融入课堂教学，着力培养学生的工程实践能力，并积极推动产学研融合。", "images": ["软件系统架构教研室/谢伟晶.jpg"], "_n": "谢伟晶", "mentor": true}, {"section": "软件系统架构教研室", "name": "苏福泉", "date": "2026-04-28", "url": "https://site.gcc.edu.cn/xydw/rjgc/rjxtjgjys1/edb58766be9d49f197539b1321c90f49.htm", "text": "苏福泉，男，工程管理硕士研究生，网络工程师，信息系统项目管理师，“双师双能型”教师。主要研究方向：信息系统项目管理、软件设计与开发。有多年的校园网和信息系统建设与运维经验。主讲《WEB应用开发》《面向对象程序设计》《数据库原理与应用》《信息系统项目管理》等课程。参与各类科研项目4项，发表学术论文10余篇。", "images": ["软件系统架构教研室/苏福泉.jpg"], "_n": "苏福泉", "mentor": true}, {"section": "软件系统架构教研室", "name": "李文崇", "date": "2026-04-28", "url": "https://site.gcc.edu.cn/xydw/rjgc/rjxtjgjys1/6fc9745a64504f1290ea102d781293d0.htm", "text": "李文崇，研究生学历，硕士学位，副教授，高级工程师。研究方向为软件过程与管理、机器学习、Python程序设计、CSCL（计算机支持的协作学习）等。本科毕业河南师范大学物理学院，硕士毕业华南师范大学教育信息技术学院。主持或参与校级和省级项目10余项，发表科研和教研论文7篇，参与编写多部教材，两次被评为优秀教师，并获得“双师双能称号”。", "images": ["软件系统架构教研室/李文崇.jpg"], "_n": "李文崇", "mentor": true}, {"section": "软件系统架构教研室", "name": "张琪", "date": "2026-04-28", "url": "https://site.gcc.edu.cn/xydw/rjgc/rjxtjgjys1/c40e436fe7cb467c99436f40f57c0d4f.htm", "text": "张琪，女，中共党员，讲师，高级信息系统项目管理师，现任广州商学院信息技术与工程学院软件系统架构教研室主任。长期从事计算机类专业教学、科研等工作，主讲《大数据应用技术》、《软件质量保证与测试》、《数据挖掘》等多门课程。主持和参与多项校级、省级教学和科研项目，并在国内外期刊上发表论文10余篇，包括SCI一区TOP期刊、北大核心期刊等，具有一定的教学经验、教学研究基础和科研能力。", "images": ["软件系统架构教研室/张琪.jpg"], "_n": "张琪", "mentor": true}, {"section": "软件系统架构教研室", "name": "刘云香", "date": "2026-04-28", "url": "https://site.gcc.edu.cn/xydw/rjgc/rjxtjgjys1/24624b3d041f43d9be77ec4ac3976523.htm", "text": "刘云香，女，中共党员，博士研究生，副教授，高级信息系统项目管理师，计算机应用技术专业。 现任广州商学院信息技术与工程学院软件工程系系主任、软件工程专任教师。曾获校教学创新大赛一等奖、蓝桥杯优秀指导老师，两次获评校优秀教学工作者，多学期绩效考核优秀，获评校级骨干教师、“双师双能型” 教师。发表学术论文 8篇（EI 收录 3 篇、SCI 收录 1 篇），主编、副主编教材 3 部，获实用新型专利 1 项，主持及参与校级以上优秀课程、一流课程及教研教改项目 6 项，长期深耕软件工程专业教学与科研工作。", "images": ["软件系统架构教研室/刘云香.jpg"], "_n": "刘云香", "mentor": true}, {"section": "智能软件应用教研室", "name": "邹锋", "date": "2026-04-28", "url": "https://site.gcc.edu.cn/xydw/rjgc/znrjyyjys1/33e6fed4628e428a9f864ec52bdd69bb.htm", "text": "邹锋，博士，副教授，考评员，校级骨干教师，双师双能型教师。长期从事数据挖掘与机器学习领域的理论与应用研究，现任大模型智能应用研究团队负责人。近年来主持及参与省级、校级科研与教改项目10余项；以第一作者在国内外核心学术期刊及EI会议发表论文20余篇；主持及参与实用新型发明专利2项；主编出版专业教材2部。坚持教研相长，深耕大数据前沿技术攻关与产教融合实践，多次荣获校级“优秀教师”及“教学优秀奖”。", "images": ["智能软件应用教研室/邹锋.jpg"], "_n": "邹锋", "mentor": true}, {"section": "智能软件应用教研室", "name": "余华", "date": "2026-04-28", "url": "https://site.gcc.edu.cn/xydw/rjgc/znrjyyjys1/2680d2480ce84f1dadac0b428f3da874.htm", "text": "余华，教授，工学博士，共产党员，硕士研究生指导教师，广东省计算机学会大数据专业委员会委员，湖北省自动化学会理事，武汉市自动化学会理事，中国武汉（南方十一省）电工理论学会理事。研究方向：大数据与云计算、人工智能等。本科毕业于国防科学技术大学，硕士、博士毕业于海军工程大学。多次荣获国家级教学技能竞赛二等奖，主持纵向和横向项目20余项，发表学术论文123篇，授权国家实用新型专利35项。", "images": ["智能软件应用教研室/余华.jpg"], "_n": "余华", "mentor": true}, {"section": "智能软件应用教研室", "name": "杨佳辉", "date": "2026-04-28", "url": "https://site.gcc.edu.cn/xydw/rjgc/znrjyyjys1/31f3e7d42eec4b7c86d145eff078f215.htm", "text": "杨佳辉，男，软件工程硕士，高级工程师。先后在公安部第三系统研究所北京锐安科技股份有限公司、航天科工706所航天中认科技(北京)责任有限公司、武汉格蓝若智能技术责任有限公司等企业工作十余年。先后主持参与6个省部级项目，发表发明专利1项。2025年7月入职广州商学院，现任信息技术与工程学院软件工程专业教师。为人诚恳、乐观向上；工作积极认真、细心负责，立志做一名优秀的人民教师。", "images": ["智能软件应用教研室/杨佳辉.jpg"], "_n": "杨佳辉", "mentor": true}, {"section": "智能软件应用教研室", "name": "徐俊", "date": "2026-04-28", "url": "https://site.gcc.edu.cn/xydw/rjgc/znrjyyjys1/2448972585184b4fadeb784c5aabf4b6.htm", "text": "徐俊，电子与通信工程专业硕士，广州商学院专任教师（其他副高级），现任智能软件应用教研室主任。讲授《离散数学》、《程序设计基础》、《面向对象程序设计》、《软件工程》等课程。获广州商学院课堂教学比赛二等奖等多项教学荣誉，指导学生获国家级和省级竞赛奖项10余项。科研方向聚焦智能软件系统、视频编解码等，主持校级项目2项，在IEEE International Conference on Multimedia、MILCOM等期刊和会议上发表论文近十篇，获授权发明专利1项。", "images": ["智能软件应用教研室/徐俊.jpg"], "_n": "徐俊", "mentor": true}, {"section": "智能软件应用教研室", "name": "魏湘辉", "date": "2026-04-28", "url": "https://site.gcc.edu.cn/xydw/rjgc/znrjyyjys1/8e0fd50fbf8e4a0eae5df6a7488c6aba.htm", "text": "魏湘辉，博士。2009年4月毕业于早稻田大学情报生产系统研究科，获博士学位。曾获早稻田大学“大川功情报通信奖”（2007年），并受日本学术振兴会资助担任Global COE高级研究助手（2008-2009年）。科研成果丰硕：参与国际标准H.265提案4项，获专利2项；发表国际会议论文8篇、SCI期刊论文2篇、核心期刊论文2篇", "images": ["智能软件应用教研室/魏湘辉.jpg"], "_n": "魏湘辉", "mentor": true}, {"section": "智能软件应用教研室", "name": "杜云梅", "date": "2026-04-28", "url": "https://site.gcc.edu.cn/xydw/rjgc/znrjyyjys1/be0e9ba59fc34460b7edbc3826dd3a01.htm", "text": "杜云梅，广州商学院信息技术与工程学院教师。她长期专注于智能新技术在医疗健康等领域的应用研究，作为项目骨干参与了多项国家重点研发计划及国家自然科学基金项目，并主持了省部级科研项目。在智慧医养、心电图与脑电信号智能分析等方面取得系列成果，主导或参与了多项行业标准的制定，拥有多项国内外发明专利。在《Nature Communications》、《IEEE Access》等高水平期刊发表学术论文多篇。她还积极通过新媒体进行知识传播与分享。", "images": ["智能软件应用教研室/杜云梅.jpg"], "_n": "杜云梅", "mentor": true}, {"section": "人工智能系", "name": "刘国福", "date": "2026-04-29", "url": "https://site.gcc.edu.cn/xydw/rgzn/wlwgcybyjsjys1/cb523f2babb84ca5ab88a1727211f43c.htm", "text": "刘国福，工学博士，正高级工程师，硕士生导师。英国兰卡斯特大学访问学者，本硕毕业于西安交通大学，博士研究生学位。主要研究领域为精确感知技术。主持/参与国家自然科学基金项目在内的省部级以上项目10余项，发表论文60余篇，其中SCI/EI收录25篇，授权发明专利10项，获发明创业奖创新奖二等奖1次，获省优秀硕士论文指导教师奖1次。主持/参与教学研究项目6项，编著教材6本，获军队教学育才奖银奖1次，获校教学一等奖1次，校教学二等奖1次。立三等功1次。", "images": ["人工智能系/刘国福.jpg"], "_n": "刘国福", "mentor": true}, {"section": "人工智能系", "name": "周俊峰", "date": "2026-04-29", "url": "https://site.gcc.edu.cn/xydw/rgzn/wlwgcybyjsjys1/7d8de53c36e549f4b7476dfc6913cf67.htm", "text": "周俊峰，男，博士，博士后，高级工程师。1999年中南大学机械电子专业本科毕业，2006年中南大学机械电子专业硕博连读获博士学位。参与多项国家级、省部级项目，包括国家高科技研究发展计划（863计划）项目1项、国家自然科学基金项目1项、国防科工委项目2项、国家计委项目1项、多项省级课题项目以及横向科研项目。获得国家科学技术进步奖二等奖 1 项，省部级一等奖3项，省部级二等奖1项, 省级重大科学技术成果1项。参与国家标准1项，团体和地方标准3项。申请发明专利6项，授权发明专利4项，获实用新型7项，获软件著作权5项。 在国内外公开刊物发表论文10余篇。", "images": ["人工智能系/周俊峰.jpg"], "_n": "周俊峰", "mentor": true}, {"section": "人工智能系", "name": "臧琼遥", "date": "2026-04-29", "url": "https://site.gcc.edu.cn/xydw/rgzn/wlwgcybyjsjys1/860cd14eec4546d2b9f37759c2373683.htm", "text": "臧琼遥，讲师，中共党员，长安大学计算机技术专业硕士。研究方向为物联网，拥有十余年高校一线教学经验，主讲《物联网技术集成与开发应用》《计算机组成原理》等专业课程，以及《高等数学》《微积分》《经济数学》等公共基础课程。", "images": ["人工智能系/臧琼遥.jpg"], "_n": "臧琼遥", "mentor": true}, {"section": "人工智能系", "name": "谢翊", "date": "2026-04-29", "url": "https://site.gcc.edu.cn/xydw/rgzn/wlwgcybyjsjys1/cc22ee689c8642ecbc6cac75b8d2c0c7.htm", "text": "谢翊，硕士。研究方向为人工智能、多模态以及物联网技术等。硕士毕业于广州大学。已发表信息检索领域顶级会议CIKM一篇。", "images": ["人工智能系/谢翊.jpg"], "_n": "谢翊", "mentor": true}, {"section": "人工智能系", "name": "吴文全", "date": "2026-04-29", "url": "https://site.gcc.edu.cn/xydw/rgzn/wlwgcybyjsjys1/b020752332ed4d05bb85489ec61cee1d.htm", "text": "吴文全，男，1972年01月10日出生，江西抚州人，汉族。毕业于中国计量大学和海军工程大学，分获学士学位和硕士学位。\n\n潜心进行教学研究，获得教学科研一二三等奖各一次，大学教学成果一二等奖各一次，发表相关教学论文20篇，讲授课程《模拟电子线路》，参加全军统考学生均分全军第一。指导电路与系统专业硕士研究生10人，电子通信系统工程硕士5人。指导硕士论文评为大学优秀硕士论文，指导研究生参加第十一届中国研究生电子设计竞赛获全国一等奖，评为全国总决赛优秀指导教师。\n\n积极进行科研工作，完成各类科研项目二十余项，获得军队科技进步奖二三等奖共四项。荣立三等功二次，获得军队院校育才银奖、大学优秀教员等奖励。", "images": ["人工智能系/吴文全.jpg"], "_n": "吴文全", "mentor": true}, {"section": "人工智能系", "name": "魏静", "date": "2026-04-29", "url": "https://site.gcc.edu.cn/xydw/rgzn/wlwgcybyjsjys1/4015a89809944332ac775b743ac14134.htm", "text": "魏静，硕士，广东潮州人。2008年在厦门大学通信与信息系统专业获得硕士学位，之后在音视频实时通信、社交平台、支付及IoT等领域从事软件开发及架构工作。2025年7月加入广州商学院，现任信息技术与工程学院专任教师。", "images": ["人工智能系/魏静.jpg"], "_n": "魏静", "mentor": true}, {"section": "人工智能系", "name": "汤义", "date": "2026-04-29", "url": "https://site.gcc.edu.cn/xydw/rgzn/wlwgcybyjsjys1/2fc3e17a2088481eb33bdc54310b3426.htm", "text": "汤义，男，计算机专业博士，副教授，“双师双能型”教师。曾就读华南理工大学获博士学位，而后在深圳大学信息与通信工程专业从事博士后研究工作。拥有部队、研究所及企业管理（曾任某部队通信所所长、工信部电子第五研究所中国赛宝低空通航实验室常务副主任、科技公司总经理等）等方面丰富实践经历。现为广州商学院信息技术与工程学院专任教师，主要承担《数据结构》《数据库原理及应用》等课程教学。进入广州商学院以来：以第一作者发表SCI一区TOP期刊论文1篇、SCI二区期刊论文1篇、EI期刊5篇及其它中文核心论文多篇，总计18篇论文；主持省部级课题2项、市厅级1项、校级1项；获软件著作权12项。", "images": ["人工智能系/汤义.jpg"], "_n": "汤义", "mentor": true}, {"section": "人工智能系", "name": "欧伟恒", "date": "2026-04-29", "url": "https://site.gcc.edu.cn/xydw/rgzn/wlwgcybyjsjys1/cc0b02dcd1a54608941c52fc76fe05f3.htm", "text": "欧伟恒，工程师，2011年获北京理工大学自动化学士学位，2015年获北京理工大学软工工程硕士学位，先后参与的多个广东省通信建设大型、重点项目获国家、省级优质工程奖，作为技术研发核心成员，参与多个项目研发并获奖，同时参编多项技术标准与专业规范制定，并在国内外期刊发表多篇论文。\n\n一、参与建设获奖项目：\n\n1、中国铁塔广东省分公司深茂高铁江茂段公网覆盖工程，国家优质工程金奖；\n\n2、中国电信创新孵化(南方)基地一、二、三期机电项目，度优质工程一等奖。\n\n二、技术研发与创新成果：\n\n1、主持的研发项目“PMGenius 智能项管系统开发研究项目”，获“省质量创新发表赛三等奖”和“广东省工程勘察设计行业协会科学技术三等奖”；\n\n2、参与的研发“BIM 模型自动审查软件开发研究项目”获中国图学学会第十届全国 BIM 大赛二等奖；\n\n三、编制《轨道交通电磁兼容检测规范》等 5 项专业规范；\n\n四、发表《共建共享模式下 4G/5G 网络质量保障及问题解决策略研究》、《物联网环境下基于人工智能的图像检测系统设计与研究》等多篇论文。", "images": ["人工智能系/欧伟恒.jpg"], "_n": "欧伟恒", "mentor": true}, {"section": "人工智能系", "name": "柳革命", "date": "2026-04-29", "url": "https://site.gcc.edu.cn/xydw/rgzn/wlwgcybyjsjys1/ff70cb20aadf4d05a021a33c7dc53b52.htm", "text": "柳革命，博士，教授。西安电子科技大学本科、西北工业大学硕博士研究生毕业，原空军工程大学军校教师，电子信息类专业课程教学20余年，治学严谨、认真负责，教学效果良好。从事噪声信号处理及模式识别科研方向研究，主持两项陕西省实验室创新研究项目、主持一项广州市科学技术局项目“基于地磁差分测量技术的路边车位车辆智能检测系统研究”。第一作者发表核心期刊学术论文14篇，发明专利授权1项.2020年获广东白云学院年度“科研工作先进个人”，2024年获广州商学院年度“教学优秀奖”。", "images": ["人工智能系/柳革命.jpg"], "_n": "柳革命", "mentor": true}, {"section": "人工智能系", "name": "梁建军", "date": "2026-04-29", "url": "https://site.gcc.edu.cn/xydw/rgzn/wlwgcybyjsjys1/4205c265278747099c88b7c9ebe026a3.htm", "text": "梁建军，硕士，讲师。江西师范大学本科、广东工业大学硕士研究生毕业。从事物联网技术应用方向研究，参与一项广东省教育科研项目、主持一项校企产学合作协同育人项目、主持2项校级教改项目，主持的广东省学校优秀教学创新成果（职业教育）获得校级一等奖。发表期刊学术论文2篇，参与发表核心期刊学术论文1篇，以第二作者发表期刊学术论文2篇，获得实用新型专利2项。指导学生参加“第九届中国大学生服务外包创新创业大赛”荣获企业命题类团体一等奖，指导学生参加第六届蓝桥杯全国软件和信息技术专业人才大赛全国总决赛并获得C/C++程序设计大学B组三等奖。", "images": ["人工智能系/梁建军.jpg"], "_n": "梁建军", "mentor": true}, {"section": "人工智能系", "name": "胡允娥", "date": "2026-04-28", "url": "https://site.gcc.edu.cn/xydw/rgzn/wlwgcybyjsjys1/ae95fcef8cd74ba790657fb172ea14c5.htm", "text": "胡允娥，副教授，人工智能系副系主任，电子与通信工程专业硕士，毕业于华南理工大学。本科毕业于山东理工大学获得通信工程工学学士和法学学士双学士。近5年来指导学生参加全国电子设计大赛、全国大学生软件设计大赛、全国大学生计算机设计大赛、蓝桥杯等多项赛事，并获得20余个国家级及省级奖项。主持或参与了省级、校级及横向项目《基于RIS辅助空间调制与分组相位偏移技术服务》、《基于ROS的智能捡球机器人》等10余项，发表高水平论文《RIS-aided Spatial Modulation with Grouping Phase Shifts》、《Spatial Modulation with Hybrid Constellations》等6篇，《智慧农业物联网环境监控系统V1.0》专利1项。参与编写《高校创新创业教育人才培养模式研究》和《人工智能与可持续发展研究》教材两部。", "images": ["人工智能系/胡允娥.jpg"], "_n": "胡允娥", "mentor": true}, {"section": "机器视觉与智能感知教研室", "name": "张燕雯", "date": "2026-04-30", "url": "https://site.gcc.edu.cn/xydw/rgzn/jqsjyzngzjys1/68f98d36da8f48b584a329788d2f321c.htm", "text": "张燕雯，女，江苏南通人，2015年本科毕业于南京工业大学自动化专业，2018年硕士毕业于华南理工大学控制工程专业，主要研究方向为刚性机械臂的控制理论研究。\n\n具有4年企业工作经验，主要从事嵌入式软件测试、汽车电子和轨道交通行业测试。现任教于信息技术与工程学院机器视觉与智能感知教研室。主要讲授“数据结构”、“数据结构与算法实验”以及“嵌入式Linux系统及应用”等课程。至今发表论文5篇，专利1篇。", "images": ["机器视觉与智能感知教研室/张燕雯.jpg"], "_n": "张燕雯", "mentor": true}, {"section": "机器视觉与智能感知教研室", "name": "张花哲", "date": "2026-04-30", "url": "https://site.gcc.edu.cn/xydw/rgzn/jqsjyzngzjys1/33461edd443e45a9a749e2885678bbb4.htm", "text": "张花哲，硕士，2016年毕业于华南农业大学车辆工程专业，获工学硕士学位。现任广州商学院信息技术与工程学院专任教师，“双师双能型”教师，主要从事无人智能技术、计算机应用技术与教育研究等工作。\n\n担任校企合作平台校内负责教师，推进实习项目落地，实现专业教学与产业需求的有效对接。先后发表学术论文多篇，其中SCI二区一篇；主持校级优秀课程项目及试点课堂项目；参与省级青年创新人才项目、校级质量工程建设项目。作为指导教师，指导学生获得国家级、省级大学生创新创业推荐项目多项，获授权专利多项。持有PMP项目管理专业人士认证。", "images": ["机器视觉与智能感知教研室/张花哲.jpg"], "_n": "张花哲", "mentor": true}, {"section": "机器视觉与智能感知教研室", "name": "于海澜", "date": "2026-04-30", "url": "https://site.gcc.edu.cn/xydw/rgzn/jqsjyzngzjys1/f8cbbc11a34d4704ac3a1a76a0b0775b.htm", "text": "于海澜，副教授，2008年硕士毕业于郑州大学，现任广州商学院信息技术与工程学院专任教师，担任人工智能系机器视觉与智能感知教研室主任，研究方向：计算机应用、人工智能等。主持省级普通高校特色创新项目1项，参与省级青年创新人才项目、省级普通高校特色创新项目3项，主持高校教学团队建设项目、校级科研课题、校级优秀课程建设项目等5项，发表国内外论文共12余篇。指导学生获得广东省大学生创新创业项目和广东省大学生攀登计划等项目多项，指导学生设计的作品获得广东省大学生计算机作品赛二等奖和三等奖等。", "images": ["机器视觉与智能感知教研室/于海澜.jpg"], "_n": "于海澜", "mentor": true}, {"section": "机器视觉与智能感知教研室", "name": "徐小杰", "date": "2026-04-30", "url": "https://site.gcc.edu.cn/xydw/rgzn/jqsjyzngzjys1/706c8b6714e645a2998f016b64bc9857.htm", "text": "徐小杰，硕士学历。2018年毕业于华南农业大学，获硕士学位，目前于华南农业大学博士在读。2019年至今任职于广州商学院信息技术与工程学院，担任专任教师。\n\n获奖情况：曾获信息系统项目管理师高级职称、获第六届中国科学技术协会优秀论文奖、广东省优秀期刊作品一等奖，以及广州商学院首届课堂教学比赛一等奖，教学与科研能力均获认可。\n\n科研方面：主要从事无人机智能作业关键技术研究。迄今共发表学术论文12篇，其中SCI/EI收录4篇、中文核心期刊5篇、普通期刊3篇；申请专利5项，登记计算机软件著作权2项；主持校级科研项目1项，参与市厅级项目4项，积累了较丰富的项目研发与协同攻关经验。", "images": ["机器视觉与智能感知教研室/徐小杰.jpg"], "_n": "徐小杰", "mentor": true}, {"section": "机器视觉与智能感知教研室", "name": "邢赫", "date": "2026-04-30", "url": "https://site.gcc.edu.cn/xydw/rgzn/jqsjyzngzjys1/3e189f4b39b541ac8c60087355f13bdf.htm", "text": "邢赫，工学博士，研究方向：计算机视觉、智慧农业、农业机器人等。2019年博士毕业于华南农业大学，其后在华中农业大学从事博士后研究工作。以人工智能算法和图像处理分析为主，同时也针对智慧农业装备核心算法进行设计与研究，所设计的机具已经在全国多地进行了试验研究，取得了较好的效果。先后在国内外期刊以第一作者发表论文20余篇，其中SCI/EI论文16余篇，国家授权发明专利10余项。主持国家自然科学基金1项、广州市基金1项，广东省教育厅项目3项，参加国家级项目20余项。获得国家级奖励2项，省部级4项。担任农业工程学报，农业机械学报， Transactions of the ASABE， Computers and Electronics in Agriculture， Int J Agric & Biol Eng等国际期刊审稿专家。并担任广州商学院人工智能系副系主任，广州商学院人工智能研究院院长。", "images": ["机器视觉与智能感知教研室/邢赫.jpg"], "_n": "邢赫", "mentor": true}, {"section": "机器视觉与智能感知教研室", "name": "夏娟", "date": "2026-04-29", "url": "https://site.gcc.edu.cn/xydw/rgzn/jqsjyzngzjys1/b183416fdeef45c391f40b54ac433531.htm", "text": "夏娟，毕业于华南农业大学，硕士，讲师，主要从事人工智能、智慧农业等领域的教学与科研工作。主持并参与多项科研与教改项目，发表多篇学术论文与专利。", "images": ["机器视觉与智能感知教研室/夏娟.jpg"], "_n": "夏娟", "mentor": true}, {"section": "机器视觉与智能感知教研室", "name": "王军虎", "date": "2026-04-29", "url": "https://site.gcc.edu.cn/xydw/rgzn/jqsjyzngzjys1/d1cd50e93c594f92a308af16622a06ce.htm", "text": "王军虎，男，陕西西安人，1974年10月出生，研究员，西北工业大学通信与信息系统专业博士研究生。深耕信息工程与人工智能领域多年，具备深厚的专业理论功底与丰富的教学科研实践经验，始终专注于专业领域的学术研究与人才培养工作。现任广州商学院信息技术与工程学院专任教授，坚守教学科研一线，将学术研究与专业教学深度融合，用心开展课程教学与学生培养工作。主要研究方向聚焦电磁兼容与防护技术、无线通信关键技术、人工智能与大数据技术，长期紧跟领域前沿开展深度研究与技术创新。科研履历扎实，先后参与多项国家级科研项目，助力领域关键技术攻关；累计发表专业学术论文6篇，获得授权专利2项，持续以科研成果反哺教学实践，全力推动信息技术与工程学科教学质量提升与专业建设发展。", "images": ["机器视觉与智能感知教研室/王军虎.jpg"], "_n": "王军虎", "mentor": true}, {"section": "机器视觉与智能感知教研室", "name": "黄世奇", "date": "2026-04-29", "url": "https://site.gcc.edu.cn/xydw/rgzn/jqsjyzngzjys1/9b50cbd2acdf498abbc0a62030524f61.htm", "text": "黄世奇，男，博士后，教授，研究生导师，现为广州商学院老师，广东省普通高校数字技术与数字经济创新团队负责人。研究方向：人工智能、遥感图像处理、模式识别、大数据与计算机应用。发表学术论文180余篇（SCI收录30多篇，EI收录70多篇），出版学术专著4部，他引1000多次。授权国防发明专利2项、国家发明专利17项。主持各类科研项目20项，其中国家自然科学基金等国家级项目3项、省自然科学基金重点等省级项目6项。获得各种奖励40余项，其中，省级科学技术奖二等奖3项，省级优秀教学成果奖二等奖3项，省级优秀科技论文奖15篇，军事重大理论优秀成果奖1项，厅级科学技术奖二等奖1项、自然科学奖一等奖1项，中国发明协会创新成果二等奖1项，获全国“百篇”优秀博士论文提名奖和全军优秀博士论文，获陕西省第九届青年科技奖荣誉称号。", "images": ["机器视觉与智能感知教研室/黄世奇.jpg"], "_n": "黄世奇", "mentor": true}, {"section": "机器视觉与智能感知教研室", "name": "何选森", "date": "2026-04-29", "url": "https://site.gcc.edu.cn/xydw/rgzn/jqsjyzngzjys1/ef0cf585081f437fa8bfc022639a5271.htm", "text": "何选森，男，1958年5月出生。研究生学历，工学硕士，立三等功一次\n\n主持承担由国务院学位委员会办公室、国家教育委员会研究生工作办公室发布的“七五”研究生教育和学位制度研究项目：理工科研究生政治素质与思维能力培养的研究。经验收合格，颁发项目研究证书。\n\n获得国防科工委科技进步奖二等奖一项，获得军队级科技进步三等奖一项，荣获学校“优秀科研奖”两次，科研促进教学优秀案例二等奖，荣获广东省计算机学会优秀论文三等奖三次。\n\n荣获广州商学院教师节“优秀教学奖”两次。获得“优秀指导教师”五次、荣获“蓝桥杯”、“互联网+”大赛优秀指导教师。\n\n科研获奖：\n\n1990年5月——1992年6月主持承担由国务院学位委员会办公室、国家教育委员会研究生工作办公室发布的“七五”研究生教育和学位制度研究项目：理工科研究生政治素质与思维能力培养的研究。经验收合格，颁发项目研究证书。\n\n1995年11月获得国防科工委科技进步奖二等奖一项：新型数据压缩软件——WHH，获奖排名：第一名。\n\n1999年10月获得军队级科技进步三等奖一项：攻防体系对抗中C3I系统对抗的建模及仿真实现，项目排名：第一名。\n\n2019年9月荣获广州华夏职业学院2018-2019学年“优秀科研奖”。\n\n2021年9月荣获广州商学院2020-2021学年教师节“优秀科研奖”。\n\n荣获广东省计算机学会2020、2021、2024年度三次优秀论文三等奖。\n\n2024年荣获广州商学院2024年科研促进教学优秀案例二等奖。\n\n教学获奖：\n\n2022年9月荣获广州商学院2021-2022学年教师节“优秀教学奖”。\n\n2023年9月荣获广州商学院2022-2023学年教师节“优秀教学奖”。\n\n指导学生获奖：\n\n获得湖南大学2004、2007、2012、2017届本科毕业设计(论文)“优秀指导教师”。\n\n荣获广州商学院2024届本科毕业设计(论文)“优秀指导教师”。\n\n荣获2023年“蓝桥杯”大赛优秀指导教师。\n\n荣获2023年“互联网+”大赛优秀指导教师。", "images": ["机器视觉与智能感知教研室/何选森.jpg"], "_n": "何选森", "mentor": true}, {"section": "智能科学与人工智能教研室", "name": "邹兰平", "date": "2026-04-30", "url": "https://site.gcc.edu.cn/xydw/rgzn/znkxyrgznjys1/bec2ad0dea904445b1280b42b8a34fd5.htm", "text": "邹兰平，女，研究生，2021年毕业于广东海洋大学，研究方向：自动化与机器人技术、智能控制。主讲“经济数学”、“高等数学”等多门课程，积极参与各项教学科研项目，获软著2项，2023年1月获学期考核“优秀”荣誉，2023年5月获院级教学比赛二等奖，多次获“结对子”工作优秀个人。", "images": ["智能科学与人工智能教研室/邹兰平.jpg"], "_n": "邹兰平", "mentor": true}, {"section": "智能科学与人工智能教研室", "name": "臧禹", "date": "2026-04-30", "url": "https://site.gcc.edu.cn/xydw/rgzn/znkxyrgznjys1/900f85422b5a47dbb8dd4d363a777d0b.htm", "text": "臧禹，副教授，工学博士，智能科学与技术教研室教师，广州商学院低空经济智创团队负责人。主要从事农用无人机智能化作业技术与无人机遥感技术研究。2019年博士毕业于华南农业大学农业机械化工程专业，后在华南农业大学从事博士后研究。近年来发表SCI论文7篇、EI论文3篇，获授权发明专利5项；主持广东省自然科学基金、广东高校重点建设学科科研能力提升项目等课题，参与国家自然科学基金、国家重点研发计划等项目20余项。兼任中国农业机械学会农业航空分会委员、副秘书长。主讲机器学习、深度学习等课程，指导学生获广东省“挑战杯”、“攀登计划”等成果，多次获最受学生喜爱教师、优秀教学奖等荣誉。", "images": ["智能科学与人工智能教研室/臧禹.jpg"], "_n": "臧禹", "mentor": true}, {"section": "智能科学与人工智能教研室", "name": "杨禹锟", "date": "2026-04-30", "url": "https://site.gcc.edu.cn/xydw/rgzn/znkxyrgznjys1/7247bb2c8bcd4e3db03c373385303e52.htm", "text": "杨禹锟，博士。研究方向为计算机视觉、深度学习及多传感器融合等。本科毕业于华南农业大学农业机械化及其自动化专业，硕士毕业于石河子大学农业工程专业，博士毕业于吉林大学农业机械化工程专业。参与国家级项目3项，以第一作者发表SCI论文5篇、EI论文1篇，授权国家发明专利10余项。", "images": ["智能科学与人工智能教研室/杨禹锟.jpg"], "_n": "杨禹锟", "mentor": true}, {"section": "智能科学与人工智能教研室", "name": "薛含笑", "date": "2026-04-30", "url": "https://site.gcc.edu.cn/xydw/rgzn/znkxyrgznjys1/306081b09eaf48c4bc73ea83afea1d01.htm", "text": "薛含笑，硕士研究生，高级工程师，毕业于广州大学，曾公派访问澳大利亚斯威本科技大学。研究领域为人工智能与机器学习算法。教学方面，荣获广东省高等学校教学管理学会2025年度教学质量管理与评价改革优秀案例评选优秀奖、广州商学院2025年教师节评选活动优秀教学奖、2025年学风建设月系列之“优秀教风”评选活动优秀教风先进个人，以及广州商学院第7届中青年教师教学大赛决赛三等奖。科研成果包括发表中文核心及SCI论文4篇、普通期刊论文若干，参与多项横向项目，主持校级项目1项。", "images": ["智能科学与人工智能教研室/薛含笑.jpg"], "_n": "薛含笑", "mentor": true}, {"section": "智能科学与人工智能教研室", "name": "夏俊", "date": "2026-04-30", "url": "https://site.gcc.edu.cn/xydw/rgzn/znkxyrgznjys1/930b42f33cc94b6d8a24f50e51ff86af.htm", "text": "夏俊、博士，先后毕业于湖南大学通信工程本科、中国科学技术大学通信与信息系统硕士，获中国科学院上海微系统与信息技术研究所通信与信息系统博士学位。曾任职教育公司 COO、合伙人等职位，统筹教学管理、项目运营与市场化运作，兼具计算机通信技术研发、项目管理，教学与科研并重，有丰富的青少年学业和职业规划指导经验，致力于为学生提供优质教育指导", "images": [], "_n": "夏俊", "mentor": true}, {"section": "智能科学与人工智能教研室", "name": "王跃文", "date": "2026-04-30", "url": "https://site.gcc.edu.cn/xydw/rgzn/znkxyrgznjys1/171e761282e14f6fb1abf650110ce351.htm", "text": "王跃文，女，讲师，“双师双能”型教师。毕业于华南农业大学，硕士研究生学历，主要研究方向为农业智能装备。拥有近十年教龄，始终秉持“教书育人、以生为本”的教育理念，坚守教学一线，关爱学生成长。在专业发展方面，她不断锤炼自身技术能力，利用寒暑假深入企业实践学习，持续提升专业技术水平和科研能力，实现了教学与工程实践的双向赋能与协同进步。", "images": ["智能科学与人工智能教研室/王跃文.jpg"], "_n": "王跃文", "mentor": true}, {"section": "智能科学与人工智能教研室", "name": "谭靖千", "date": "2026-04-30", "url": "https://site.gcc.edu.cn/xydw/rgzn/znkxyrgznjys1/c60c18c5890c4b9abafc6df3995f18e0.htm", "text": "谭靖千，助教，硕士。三级人工智能训练师。拥有多年高校教学工作经验，长期承担《高等数学》《线性代数》《经济数学》等课程教学，教学经验丰富。参与多项省级、校级教学和科研项目，在国内外刊物上发表论文多篇。主要研究方向为高校教育教学技术应用、人工智能应用、遥感数据分析处理。", "images": ["智能科学与人工智能教研室/谭靖千.jpg"], "_n": "谭靖千", "mentor": true}, {"section": "智能科学与人工智能教研室", "name": "黄曦朗", "date": "2026-04-30", "url": "https://site.gcc.edu.cn/xydw/rgzn/znkxyrgznjys1/3bd493366f0a4e3ab23a65d81d3f2c90.htm", "text": "黄曦朗，工学博士，毕业于韩国釜庆大学，2022—2025 年于韩国梨花女子大学从事博士后研究，现任广州商学院信息工程与技术学院专任教师。主要研究方向为小样本学习、图神经网络、多模态信息融合与开放集识别等人工智能前沿领域。主讲《大模型原理与实践》《强化学习及其应用》等专业课程，注重结合案例实操、代码训练与项目实践。累计发表高水平学术论文 7 篇，其中一区 Top 论文 3 篇。", "images": ["智能科学与人工智能教研室/黄曦朗.jpg"], "_n": "黄曦朗", "mentor": true}, {"section": "智能科学与人工智能教研室", "name": "谷秀艳", "date": "2026-04-30", "url": "https://site.gcc.edu.cn/xydw/rgzn/znkxyrgznjys1/795682fdda724e74bf5d9750f950bf36.htm", "text": "谷秀艳，硕士，讲师，2017年毕业于华南农业大学工程学院，获计算机技术与软件专业技术资格“高级信息系统项目管理师”。主要承担《机器学习》《Python程序设计》《概率论与数理统计》《微积分》等课程教学，学生评教排名前30%，曾获“学生最喜爱教师奖”“优秀教学奖”。研究方向为智慧农业，主持青年创新人才项目“植保无人机仿地定高飞行关键技术算法研究与示范应用”及1项省级横向项目，均已按期结题；参与省市级、校级科研及学科建设项目十余项，发表论文十余篇。现为低空经济智创团队负责人之一，指导学生参加“攀登计划”“大创”“挑战杯”等竞赛并获省级奖项。", "images": ["智能科学与人工智能教研室/谷秀艳.jpg"], "_n": "谷秀艳", "mentor": true}, {"section": "智能科学与人工智能教研室", "name": "陈其龙", "date": "2026-04-30", "url": "https://site.gcc.edu.cn/xydw/rgzn/znkxyrgznjys1/999d6a8d46a84a00ad0f1e51ad6fc676.htm", "text": "陈其龙，博士研究生，2009年本科毕业于大连理工大学，2015年硕士毕业于中山大学，2024年博士毕业于菲律宾圣保罗大学，主要研究方向是人工智能和移动软件开发，在广州商学院工作以来，主持和参与了省部级项目2项，市厅级项目3项，校级课题多项，发表论文9篇，获得学校优秀教学奖2次，多年来指导学生比赛获得过国家级奖项1次，省级奖项多次。", "images": ["智能科学与人工智能教研室/陈其龙.jpg"], "_n": "陈其龙", "mentor": true}, {"section": "大数据技术与工程系", "name": "庄纬豪", "date": "2026-04-30", "url": "https://site.gcc.edu.cn/xydw/dsjjsygc/sjkxyfxjys1/7fe4e05ebe0b4c97abe725a419dec2cd.htm", "text": "庄纬豪,男,博士。研究方向深度学习,计算机视觉,AI图像处理等。博士毕业于神户大学。曾于企业任职算法工程师职位,有丰富的深度学习算法研发经验。发表CCF-A类会议workshop1篇,SCI期刊3篇,以及国际和国内学术会议论文多篇。", "images": ["大数据技术与工程系/庄纬豪.jpg"], "_n": "庄纬豪", "mentor": true}, {"section": "大数据技术与工程系", "name": "叶丽珠", "date": "2026-04-30", "url": "https://site.gcc.edu.cn/xydw/dsjjsygc/sjkxyfxjys1/0348e96e82fc403dbf2746010bb6d7d3.htm", "text": "叶丽珠，教授，硕士生导师，大数据技术与工程系系主任。广东省大数据专委会委员，广州商学院教学督导、学术委员会委员。研究方向为数据挖掘、大数据与人工智能应用。主持省级项目4项及其他教科研项目20余项，主编教材12部，发表论文20余篇，获省科技进步奖二等奖1项及软著与专利4项。个人获评广东省民办高校“优秀教师”等荣誉18项，指导学生学科竞赛获国家级、省级奖项26项。", "images": ["大数据技术与工程系/叶丽珠.jpg"], "_n": "叶丽珠", "mentor": true}, {"section": "大数据技术与工程系", "name": "万亚利", "date": "2026-04-30", "url": "https://site.gcc.edu.cn/xydw/dsjjsygc/sjkxyfxjys1/a1bb8467b7fa4c1dadd8f01bac1fd998.htm", "text": "万亚利，硕士研究生，助教，“双师双能”型教师，现任广州商学院信息技术与工程学院数据科学与分析教研室主任、专任教师。教育背景扎实，深耕教学科研一线，主讲《Python程序设计》《算法分析与设计》等核心课程。曾获校级2次优秀教学奖、广州商学院第一届课堂教学比赛一等奖；聚焦人工智能、医学图像算法领域研究，近年来，发表学术论文4篇，获发明专利授权2项，具备丰富的行业实践经验，曾任职于国内某医疗器械公司，担任医学图像算法工程师，积累了扎实的工程实践能力，兼具行业实践与教研能力。", "images": ["大数据技术与工程系/万亚利.jpg"], "_n": "万亚利", "mentor": true}, {"section": "大数据技术与工程系", "name": "卢利敏", "date": "2026-04-30", "url": "https://site.gcc.edu.cn/xydw/dsjjsygc/sjkxyfxjys1/bd8c4dfd8ee148f6b597bdbf85584bd4.htm", "text": "卢利敏，硕士研究生，毕业于广东工业大学计算机科学与技术专业，本科毕业于江西理工大学计算机科学与技术专业。现任广州商学院专任教师，主要从事计算机相关课程的教学与科研工作。具备扎实的专业基础与良好的科研素养，曾发表CCF-C类会议论文2篇，并获得软件著作权1项。曾就职于广州农村商业银行总行金融科技部，从事信息系统开发与项目管理工作，参与并主导多个信息化系统建设项目，具备扎实的软件开发能力与工程实践经验。致力于将企业实践与课堂教学相结合，提升学生的数据分析能力与工程应用能力。", "images": ["大数据技术与工程系/卢利敏.jpg"], "_n": "卢利敏", "mentor": true}, {"section": "大数据技术与工程系", "name": "刘婵娟", "date": "2026-04-30", "url": "https://site.gcc.edu.cn/xydw/dsjjsygc/sjkxyfxjys1/28010a4dc8a64497be278c4e13b6385f.htm", "text": "刘婵娟，理学博士，现任广州商学院信息技术与工程学院大数据技术与工程系数据科学与分析教研室专任教师。\n\n长期致力于天然气水合物、二氧化碳封存领域的计算模拟研究，深耕高性能计算与数值模拟方向，具备坚实的交叉学科研究功底与工程应用能力。\n\n主讲操作系统、数据库原理与应用等大数据专业核心课程，教学严谨，注重专业理论与工程实践融合。近年来围绕能源计算与碳封存领域发表多篇 SCI 收录学术论文，持续在大数据、高性能计算与低碳能源技术交叉方向开展科研探索。", "images": ["大数据技术与工程系/刘婵娟.jpg"], "_n": "刘婵娟", "mentor": true}, {"section": "大数据技术与工程系", "name": "李刚", "date": "2026-04-30", "url": "https://site.gcc.edu.cn/xydw/dsjjsygc/sjkxyfxjys1/27de00fc406c4cba8e6a8443b0aaf62f.htm", "text": "李刚，男，博士，讲师，主要研究方向是图数据，图算法，图神经网络等。华南理工大学计算机应用专业博士、专业学位硕士研究生校外指导教师，佛山市玖章智能科技有限公司创始人&总经理；中国仿真学会智能仿真优化与调度专委会委员，西安电子科技大学广州研究院专业学位硕士研究生企业指导教师，广东省计算机学会软件工程专业委员会委员，广东省运筹学会物流分会理事。以第一作者发表SCI论文4篇。作为主要参与者参与国家自然科学基金2项。主持开发项目10余项，累计金额超过500万。", "images": ["大数据技术与工程系/李刚.jpg"], "_n": "李刚", "mentor": false}, {"section": "大数据技术与工程系", "name": "金龙", "date": "2026-04-30", "url": "https://site.gcc.edu.cn/xydw/dsjjsygc/sjkxyfxjys1/6151b02b16cc4d6794a5bb33e960a07d.htm", "text": "金龙，计算机科学博士，博士毕业于韩国忠北国立大学。曾于韩国某研究院任职高级研究员、国内某快递物流公司任职于研发经理和战略规划经理，有丰富的研发经验和战略规划经验。获得快递设备工程中级工程师和快递设备工程高级工程师，获得邮政行业科技英才，曾发表多篇SCIE论文，拥有多项授权专利，并参与行业标准编制。主要研究方向为数据挖掘、智能物流干线动态路由规划和优化、物流分拨中心选址和布局规划、物流商业模式研究、物流设备研发等方面的研究工作。", "images": ["大数据技术与工程系/金龙.jpg"], "_n": "金龙", "mentor": true}, {"section": "大数据技术与工程系", "name": "黄嘉纶", "date": "2026-04-30", "url": "https://site.gcc.edu.cn/xydw/dsjjsygc/sjkxyfxjys1/a957b9d5880540d88019fd62d3dae3e0.htm", "text": "黄嘉纶，数学与计算机科学学士，数学博士。研究方向为计算群论、机器学习及其在金融风险管理与信贷的应用，曾于银行、互联网大厂，上市头部互联网金融公司任职高级风险经理、风控总监、高级算法专家等岗位。主要从事巴塞尔协议下的银行全面风险管理、风险计量、机器学习与人工智能及其在金融风控、信贷的应用，曾主持多家金融机构巴塞尔全面风险管理、智能风控与信贷相关的多个项目的设计、实施与落地。", "images": ["大数据技术与工程系/黄嘉纶.jpg"], "_n": "黄嘉纶", "mentor": true}, {"section": "大数据技术与工程系", "name": "代丽娜", "date": "2026-04-30", "url": "https://site.gcc.edu.cn/xydw/dsjjsygc/sjkxyfxjys1/b6971aa502b24f728d1618ada43d1142.htm", "text": "代丽娜，硕士研究生学历，毕业于长春工业大学。双师双能型教师，具备十年企业一线研发工作经验。注重教学改革与工程实践教学的有机融合，持续探索课程体系优化、教学方法创新及人才培养模式等方向。先后在国内外期刊发表教改及科研论文十余篇，主持或作为主要参与人完成教改、科研项目十余项。", "images": ["大数据技术与工程系/代丽娜.jpg"], "_n": "代丽娜", "mentor": true}, {"section": "信息系统与智能决策教研室", "name": "郑冬花", "date": "2026-04-30", "url": "https://site.gcc.edu.cn/xydw/dsjjsygc/xxxtyznjcjys1/e8bbd69670694a92a509626e47a7163b.htm", "text": "郑冬花，副教授，现任大数据技术与工程系副主任，信息管理与信息系统专业负责人，广东省计算机学会大数据专业委员员委员，华南理工大学访问学者，广州商学院“双师双能型”教师。长期深耕于软件工程领域的教学与科研工作。主攻研究方向是数据挖掘和数据分析，主持省级项目2项及其他教科研项目8项，在国内外重要刊物上发表论文十余篇，参与编写教材2篇，主讲《面向对象程序设计》《python程序设计》《数据库原理与应用》等核心课程已逾24年，在教学上荣获2021和2022年度校级优秀教学奖，2025年校级优秀科研奖。2021年度课程思政优秀教学案例二等奖、2020中青年教师教学大赛优秀奖，2020年网络教学优秀教师等。", "images": ["信息系统与智能决策教研室/郑冬花.jpg"], "_n": "郑冬花", "mentor": true}, {"section": "信息系统与智能决策教研室", "name": "俞猷邦", "date": "2026-04-30", "url": "https://site.gcc.edu.cn/xydw/dsjjsygc/xxxtyznjcjys1/a6edb2a7f35f4260833157a024b30517.htm", "text": "俞献邦，硕士研究生，主要研究方向为自然语言处理。2021年毕业于东华理工大学软件工程专业，获学士学位；2023年毕业于英国纽卡斯尔大学高级计算机科学专业，获硕士学位。求学期间，系统研习计算机科学、软件工程相关专业理论知识，专业基础扎实，知识体系完整，具备良好的专业素养。", "images": ["信息系统与智能决策教研室/俞猷邦.jpg"], "_n": "俞猷邦", "mentor": true}, {"section": "信息系统与智能决策教研室", "name": "徐丹", "date": "2026-04-30", "url": "https://site.gcc.edu.cn/xydw/dsjjsygc/xxxtyznjcjys1/c7de1c40e2254f939949149b9598863e.htm", "text": "徐丹，女，硕士研究生，研究方向为系统设计与开发与数据挖掘与分析。累计主持和参与科研项目10余项，公开发表国内外文章10余篇。多次参与指导学生参加蓝桥杯、计算机软件设计大赛、大创等比赛项目。主讲《数据结构》《Python程序设计》《面向对象程序设计》《Web前端应用开发》《机器学习基础》等课程。", "images": ["信息系统与智能决策教研室/徐丹.jpg"], "_n": "徐丹", "mentor": true}, {"section": "信息系统与智能决策教研室", "name": "王莎莎", "date": "2026-04-30", "url": "https://site.gcc.edu.cn/xydw/dsjjsygc/xxxtyznjcjys1/489cb29cf7034b969777d829e8cd2c05.htm", "text": "王莎莎，硕士，毕业于山东理工大学计算机技术专业，讲师，广州商学院双师双能型专任教师，任职于数据科学与大数据技术专业。持有信息系统项目管理师高级资格证书，兼任广东省大数据专委会委员，拥有近十年高校计算机相关专业教学经验。主讲《Python 程序设计》《Web 应用开发》《数据采集技术》《数字图像处理》《算法分析与设计》等核心课程。科研方向主要为软件开发、算法设计、大数据与人工智能应用；主持校级科研项目 1 项，参与各类教科研课题 5 项以上。\n\n竞赛指导经验丰富，长期指导学生参与蓝桥杯、挑战杯、全国大学生服务外包创新创业大赛、全国大学生计算机设计大赛、全国大学生数据分析实践赛等高水平学科竞赛，多次斩获国家级一、三等奖及省级各类奖项。个人先后荣获广东省优秀指导教师、校级教师节优秀教学奖、学期考核优秀等各类荣誉十余项。", "images": ["信息系统与智能决策教研室/王莎莎.jpg"], "_n": "王莎莎", "mentor": true}, {"section": "信息系统与智能决策教研室", "name": "邱明辉", "date": "2026-04-30", "url": "https://site.gcc.edu.cn/xydw/dsjjsygc/xxxtyznjcjys1/4beee3229e6040efa476de1b72825284.htm", "text": "邱明辉，毕业于中山大学信息管理学院，管理学博士。现为学校管理工程专业教授，广东省计算机学会理事。在教学方面，为信息管理专业本科生讲授《信息资源管理》、《管理信息系统》、《ERP原理与应用》等主干课程，指导学生完成毕业实习与毕业设计工作。在科研方面，主持或参与科研项目十余项，其中主持省级项目3项，作为主要成员参与国家社科基金项目3项、教育部项目1项。主要研究方向为信息查询系统、用户体验，已出版学术专著1部、参编著作3部，累计发表学术论文 50余篇，其中7篇被人大复印报刊资料全文转载。履职期间曾多次获评校级优秀共产党员、优秀教师，多次获得学校年度教学质量优秀奖。", "images": ["信息系统与智能决策教研室/邱明辉.jpg"], "_n": "邱明辉", "mentor": true}, {"section": "信息系统与智能决策教研室", "name": "乐炯", "date": "2026-04-30", "url": "https://site.gcc.edu.cn/xydw/dsjjsygc/xxxtyznjcjys1/1d56f8a79762450fa2c657a5ed7da3ec.htm", "text": "乐炯，男，1976年11月生，博士，高级工程师。研究方向：医疗信息化、信息管理、计算机网络技术等。本科毕业于华北电力大学信息工程专业，硕士毕业于日本山口大学智能信息系统工程专业，博士毕业于日本山口大学信息与设计工程专业。发表科研论文10余篇、实用新型专利2项。央企17年工作经验，负责省级电信机房的建设、维护、运营支撑，负责短信、企信通等产品的设计和上线运行；三甲医院5年工作经验，负责医疗信息化推进，建设智慧医院，牵头医院信息机房的平台软件、网络硬件的建设维护。", "images": ["信息系统与智能决策教研室/乐炯.jpg"], "_n": "乐炯", "mentor": true}, {"section": "信息系统与智能决策教研室", "name": "姜波", "date": "2026-04-30", "url": "https://site.gcc.edu.cn/xydw/dsjjsygc/xxxtyznjcjys1/436526168a8a40008967df99cda4b89f.htm", "text": "姜波，男，1975年03出生，副教授，毕业于北京交通大学，管理科学与工程博士，应用经济学博士后。先后在大公信用、国网电商、海南绿金院等企业与机构工作，主要从事信用评级、金融科技发展、征信管理与数据隐私保护、绿色金融与ESG评级领域的政策研究与技术开发工作。", "images": ["信息系统与智能决策教研室/姜波.jpg"], "_n": "姜波", "mentor": true}, {"section": "信息系统与智能决策教研室", "name": "黄灿辉", "date": "2026-04-30", "url": "https://site.gcc.edu.cn/xydw/dsjjsygc/xxxtyznjcjys1/e6e1740794ce410692edfd4b607e8f3b.htm", "text": "黄灿辉，女，毕业于武汉交通科技大学。主讲过《数据库原理与应用》、《管理信息系统》、《信息系统分析与设计》等多门课程。主要研究方向数据库技术、计算机应用。教学理念：淡化形式、注重实质、深挖基础、慢工细活。", "images": ["信息系统与智能决策教研室/黄灿辉.jpg"], "_n": "黄灿辉", "mentor": true}, {"section": "大数据工程教研室", "name": "周健烨", "date": "2026-04-30", "url": "https://site.gcc.edu.cn/xydw/dsjjsygc/dsjgcjys1/6f48febfd7964b079fa472b66cf5deba.htm", "text": "周健烨，硕士研究生。毕业于广东技术师范大学控制科学与工程专业，获硕士学位。现任广州商学院信息技术与工程学院专任教师，主要从事数据挖掘、机器学习算法教学与研究工作。参与多项教学改革与科研项目，以第一作者在省级期刊发表学术论文若干篇。曾获校级考核优秀、院级课堂教学比赛二等奖、获评蓝桥杯优秀指导教师、数模竞赛优秀指导教师，指导学生获国家级三等奖、省级一等奖项。", "images": ["大数据工程教研室/周健烨.jpg"], "_n": "周健烨", "mentor": true}, {"section": "大数据工程教研室", "name": "张兰", "date": "2026-04-30", "url": "https://site.gcc.edu.cn/xydw/dsjjsygc/dsjgcjys1/8f8830eba8df4739ac7036cb7edb415c.htm", "text": "张兰，1984 年生，硕士研究生，高级工程师，毕业于北京工业大学生物医学工程专业。现任广州商学院信息技术与工程学院大数据工程教研室主任，从教 5 年，主讲大数据应用技术、大数据技术综合实验等课程，专注新商科大数据课程体系建设与混合式教学改革。教学期间获评优秀毕业论文指导教师、学期考核优秀，指导学生斩获第十二届 “中国软件杯” 全国三等奖。\n\n拥有十余年行业从业经验，深耕医疗及焊接信息化系统研发与产品管理，历任软件工程师、项目负责人、产品经理，主导多款工业软件与云平台的架构设计、研发及落地。科研成果丰厚，发表多篇学术论文及软件著作权，参编行业团体标准，斩获中国机械工业科学技术奖、全国工业 APP 大赛优秀解决方案奖等，是集教学、科研、技术实践于一体的复合型专业人才。", "images": ["大数据工程教研室/张兰.jpg"], "_n": "张兰", "mentor": true}, {"section": "大数据工程教研室", "name": "彭仁华", "date": "2026-04-30", "url": "https://site.gcc.edu.cn/xydw/dsjjsygc/dsjgcjys1/e4e68381f0274329a1d0ae141d41e260.htm", "text": "个人简介：彭仁华，硕士研究生，本科江西师范大学数学与应用数学专业毕业，研究生广西师范大学概率论与数理统计专业毕业，指导学生参加全国大学生数学建模竞赛获广东省分赛二等奖", "images": [], "_n": "彭仁华", "mentor": true}, {"section": "大数据工程教研室", "name": "林树青", "date": "2026-04-30", "url": "https://site.gcc.edu.cn/xydw/dsjjsygc/dsjgcjys1/43124f714f614c2c88f69e65c3511e33.htm", "text": "林树青，中共党员，教授。毕业于蒙古乌兰巴托研究大学电子信息工程专业，硕士研究生。广东省计算机学会数据科学与大数据专委会委员。曾先后多次获得学校“优秀教职工”3次，多次获得“优秀管理工作者”、绩效考核“优秀”奖，获得学校“优秀教师”，“优秀共产党员”，“结对子”优秀个人等称号。主持厅级项目1项，参加多个省级、厅级课题研究。参编《办公软件高级应用与实践》《数据库原理与应用》等教材2部。公开发表各级别计算机应用论文20余篇。", "images": ["大数据工程教研室/林树青.jpg"], "_n": "林树青", "mentor": true}, {"section": "网络空间安全与数字媒体系", "name": "肖红", "date": "2026-04-30", "url": "https://site.gcc.edu.cn/xydw/wlkjaqyszmt/wlkjaqjys/99d45977503e41ae810a851f7ec085b3.htm", "text": "肖红，男，硕士研究生，副教授。长期从事专业教学、科学研究与学生培养工作，教学经验丰富。\n\n科研教研层面，聚焦专业领域研究，累计公开发表学术论文10篇；主持省级课题1项、校级课题3项；主编省级规划教材1部。深耕课堂教学改革，荣获省级教学能力竞赛三等奖1项，中教集团教学能力竞赛二等奖1项，校级教学能力竞赛一等奖、二等奖各1项；主持建设学银在线开放课程1门，积极推动信息化教学与线上线下混合式教学落地实施。\n\n人才培养方面，专注学生实践能力与综合素质提升，常态化指导学生参与各类专业技能竞赛，指导学生荣获国家级一等奖1项、二等奖1项、三等奖3项，省级竞赛奖项十余项。\n\n履职期间，师德师风端正，工作勤勉务实，先后4次获评学校优秀教师、1次获评民办优秀教师。", "images": ["网络空间安全与数字媒体系/肖红.jpg"], "_n": "肖红", "mentor": true}, {"section": "网络空间安全与数字媒体系", "name": "王欢", "date": "2026-04-30", "url": "https://site.gcc.edu.cn/xydw/wlkjaqyszmt/wlkjaqjys/b011a05053ba447c8444a39dd7742713.htm", "text": "王欢，毕业于兰州大学计算机科学与技术专业。高级工程师。曾在企业从事20多年的计算机软件开发工作。期间，主持/负责多项市级科技项目，兼任中南大学硕士专业学位研究生校外兼职指导教师。广东政府采购智慧云平台专家库、广东省阳光政务平台评审专家库、广东省知识产权局专家库等入库专家。参与北京网络空间安全协会及广东网络空间安全协会的“网络空间安全专业人员认证规范”的参编工作。", "images": ["网络空间安全与数字媒体系/王欢.jpg"], "_n": "王欢", "mentor": true}, {"section": "网络空间安全与数字媒体系", "name": "王海", "date": "2026-04-30", "url": "https://site.gcc.edu.cn/xydw/wlkjaqyszmt/wlkjaqjys/b8219e55e0ae457491a1f11ddc4b4d05.htm", "text": "王海，工程硕士，副教授，广东省民办教育优秀教师。研究方向：分布式系统、微服务架构及算法优化等。主持或参与省部级教研教改课题6项，发表教研教改论文十余篇，参编教材5本，2项国家实用新型专利，软件著作登记权2项。指导学生参加广东省大学生计算机设计大赛、“挑战杯-彩虹人生”广东职业院校创新创业大赛等各类竞赛，获奖十余项。", "images": ["网络空间安全与数字媒体系/王海.jpg"], "_n": "王海", "mentor": true}, {"section": "网络空间安全与数字媒体系", "name": "李文", "date": "2026-04-30", "url": "https://site.gcc.edu.cn/xydw/wlkjaqyszmt/wlkjaqjys/4ada92074b4d4d8fa9657f2819329206.htm", "text": "李文，男，本科（硕士）学历，现任广州商学院信息技术与工程学院专任教师、实验员，中级职称。2003-2007年于天津军事交通学院计算机应用专业完成全日制本科学习，2010-2012年在南京大学软件工程专业攻读硕士学位。任职以来，长期深耕计算机类课程教学，严谨治学、注重理论与实践融合，获现职称后公开发表学术论文2篇，积极参与工业软件、人工智能相关师资培训，锤炼专业能力，履职尽责、关爱学生，兼具教学与管理素养。", "images": ["网络空间安全与数字媒体系/李文.jpg"], "_n": "李文", "mentor": true}, {"section": "网络空间安全与数字媒体系", "name": "李法彩", "date": "2026-04-30", "url": "https://site.gcc.edu.cn/xydw/wlkjaqyszmt/wlkjaqjys/f0ccd562fadf4e728227e2405b6ce537.htm", "text": "李法彩，硕士，研究方向为密码学与信息安全、深度学习在差分密码分析中的应用。本科毕业于中南民族大学软件工程专业，硕士毕业于桂林电子科技大学计算机科学与技术专业。参与纵向项目2项，发表科研论文1篇。", "images": ["网络空间安全与数字媒体系/李法彩.jpg"], "_n": "李法彩", "mentor": true}, {"section": "网络空间安全与数字媒体系", "name": "黄太秦", "date": "2026-04-30", "url": "https://site.gcc.edu.cn/xydw/wlkjaqyszmt/wlkjaqjys/b8be11687cc1417bb87774ab5a070ccc.htm", "text": "黄太秦，硕士研究生，网络空间安全教研室专任教师，网络安全协会指导老师。2023 年入职广州商学院，主讲 Python、数据结构、网络安全综合演练、人工智能、深度学习等课程。\n\n主要研究方向为深度强化学习、端边云协同优化与网络安全。主持与参与多项科研项目，发表 SCI 二区论文 1 篇，授权发明专利 1 项。曾获校级教学比赛优秀奖，指导学生获中国国际大学生创新大赛校级铜奖。\n\n长期负责网络安全竞赛与实践教学，组织 415 国家安全教育日、东湖论剑杯、湾区杯、羊城杯等活动。", "images": ["网络空间安全与数字媒体系/黄太秦.jpg"], "_n": "黄太秦", "mentor": true}, {"section": "网络安全工程教研室", "name": "卓思捷", "date": "2026-05-06", "url": "https://site.gcc.edu.cn/xydw/wlkjaqyszmt/wlaqgcjys/1c8de366a7b14612b55ef1496a617d66.htm", "text": "卓思捷，2025年5月获奥克兰大学计算机科学博士学位，博士阶段主要研究以人为本的网络钓鱼易感性，关注网络安全中的风险判断、用户行为与防御机制。其研究兼具计算机科学与人因安全背景，熟悉安全实验设计、数据分析、模拟钓鱼测试、培训材料与实验工具开发。博士期间曾开发用于研究用户钓鱼行为的实验工具，开展两轮实验室研究，并与奥克兰大学信息安全部门合作完成三轮模拟钓鱼邮件测试。科研成果方面，以第一作者在 ACM Transactions on Privacy and Security、CHI、EuroUSEC、USEC、OzCHI 等网络安全、人机交互与可用安全领域期刊和会议发表多篇论文。", "images": ["网络安全工程教研室/卓思捷.jpg"], "_n": "卓思捷", "mentor": true}, {"section": "网络安全工程教研室", "name": "吴昊驰", "date": "2026-05-06", "url": "https://site.gcc.edu.cn/xydw/wlkjaqyszmt/wlaqgcjys/f968cbeca03f483ea580c8366388eac4.htm", "text": "吴昊驰，广东广州人。获国内本科学士学位，信息系统与信息管理专业。获国外硕士研究生学位，信息技术安全专业。曾任职于加拿大丰业银行，职位网络威胁情报分析师。", "images": ["网络安全工程教研室/吴昊驰.jpg"], "_n": "吴昊驰", "mentor": true}, {"section": "网络安全工程教研室", "name": "汤毅豪", "date": "2026-05-06", "url": "https://site.gcc.edu.cn/xydw/wlkjaqyszmt/wlaqgcjys/f37eb7107b4945c6a45c0c35283baded.htm", "text": "汤毅豪，广东工业大学软件工程硕士，专注恶意代码分析、程序调试可视化与网络空间安全研究。发表《单链结构实时识别及可视化布局算法研究》学术论文，获授权发明专利《一种数据结构可视化调试方法》，获 2026 年全国高校网络空间安全专业课程教学案例征集评选一等奖。具备多年通信运维类系统开发经验，技术扎实、工程实践能力强。现主要承担《恶意代码分析与防护》《漏洞扫描与防护》等课程教学工作，深耕网络安全技术与教学实践，擅长将研发成果与教学内容融合，兼具学术研究、工程开发与高校教学能力，致力于网络空间安全领域技术创新与人才培养。", "images": ["网络安全工程教研室/汤毅豪.jpg"], "_n": "汤毅豪", "mentor": true}, {"section": "网络安全工程教研室", "name": "李威", "date": "2026-05-06", "url": "https://site.gcc.edu.cn/xydw/wlkjaqyszmt/wlaqgcjys/fac16a210f4a4b29815786177826b68c.htm", "text": "李威，男，助教，2020年获得湖南工业大学学士学位，2023年获得广州大学计算机技术专业硕士学位，主要负责网络空间安全，计算机基础等相关课程的教学工作。曾获得毕业论文优秀指导教师。", "images": ["网络安全工程教研室/李威.jpg"], "_n": "李威", "mentor": true}, {"section": "网络安全工程教研室", "name": "赖浪文", "date": "2026-05-06", "url": "https://site.gcc.edu.cn/xydw/wlkjaqyszmt/wlaqgcjys/d7b02b986c0e4a41b6a0d5261ac8bc37.htm", "text": "赖浪文，男，广州大学计算机技术专业硕士。发表《Towards Chinese text and DNA shift encoding scheme based on biomass plasmid storage》学术论文。主要负责网络攻防、程序开发等相关课程的教学工作。", "images": ["网络安全工程教研室/赖浪文.jpg"], "_n": "赖浪文", "mentor": true}, {"section": "数字媒体与创意工程教研室", "name": "庄志蕾", "date": "2026-05-06", "url": "https://site.gcc.edu.cn/xydw/wlkjaqyszmt/szmtycygcjys1/88cbe0255a5e453189dbece0b7534890.htm", "text": "庄志蕾，女，硕士，广州商学院信息技术与工程学院任专任教师，现任数字媒体与创意工程教研室主任。2014年-2022年兼任广东省高等学校大学计算机课程考试命题委员会Photoshop组命题委员。\n\n主要负责《计算机应用基础》、《计算机图像处理基础基础（Photoshop）》、《数据库技术原理》、《Python程序设计》、《人工智能通识基础》等多门课程的教学工作。曾参与编写多部教材，任主编的PS系列教材受到多所高校订购，发行量达三万余册。大学生计算机设计大赛广商校内负责人之一，多次组织学生参加计算机设计大赛并获得奖项。\n\n在教学中注重因材施教，激发学生学习积极性，两次次获得教学成果奖。", "images": ["数字媒体与创意工程教研室/庄志蕾.jpg"], "_n": "庄志蕾", "mentor": true}, {"section": "数字媒体与创意工程教研室", "name": "张朝霞", "date": "2026-05-06", "url": "https://site.gcc.edu.cn/xydw/wlkjaqyszmt/szmtycygcjys1/923e2df2935c41c08264dd7ad9626833.htm", "text": "张朝霞1972年生，本科毕业于广州美术学院，文学学士，工业设计高级工程师、高级人力资源管理师。\n\n研究方向：美术设计、多媒体艺术鉴赏、UI设计、AI美图绘图、AI职业创新等现代数字媒体视觉艺术。有深厚美术基本功底与艺术造诣，熟悉造型艺术、数字视觉艺术、空间艺术、静态艺术。具有丰富的企业管理能力，多年担任公司的副经理和总经理等职务。具有宣传、广告设计与策划、职业发展规划方面指导力。\n\n教育成果：历年组织物联网工程专业的师生积极参加各级政府组织的科技创新和技能竞赛，获得多项省级奖项；软件著作权、科研成果丰富。指导发表的论文多篇。2021年编写的《学前美术基础》由清华大学出版社出版，成为多家高等院校学生使用教材。", "images": ["数字媒体与创意工程教研室/张朝霞.jpg"], "_n": "张朝霞", "mentor": true}, {"section": "数字媒体与创意工程教研室", "name": "邢达", "date": "2026-05-06", "url": "https://site.gcc.edu.cn/xydw/wlkjaqyszmt/szmtycygcjys1/0e66746f1a11439ba960312c38f42140.htm", "text": "邢达，教育技术学博士，现任教于广州商学院。本硕博分别就读于安徽师范大学、浙江师范大学及韩国釜庆大学，并曾赴澳门大学深造。研究方向聚焦学生学业成就影响因素、信息技术接受度、在线学习行为等，擅长元分析、元结构方程模型等量化研究方法。近期在SSCI一区期刊发表论文一篇，并在Scopus、KCI、CSSCI等其他国内外核心期刊合作发表论文共6.7篇，内容涉及自我效能感、学习流体验、教师关怀行为、社会支持与学业成绩关系等热点议题。", "images": ["数字媒体与创意工程教研室/邢达.jpg"], "_n": "邢达", "mentor": true}, {"section": "数字媒体与创意工程教研室", "name": "宁晓虹", "date": "2026-05-06", "url": "https://site.gcc.edu.cn/xydw/wlkjaqyszmt/szmtycygcjys1/83f1f84b657a4d398597b21badc9a12e.htm", "text": "宁晓虹，女，中共党员，副教授，博士。广州商学院信息技术与工程学院专任教师。曾任信息技术与工程学院教工党支部书记，华为ICT学院办公室主任。个人主持及参与校级以上项目6项，公开发表论文、著作等近20项。多次获“优秀党务工作者”、“优秀共产党员”、“新闻宣传工作先进个人”等荣誉；曾获广州商学院“优秀管理工作奖”、“教育园优秀教职工三等奖”、“广州商学院第一届课堂教学比赛一等奖”等奖项。", "images": ["数字媒体与创意工程教研室/宁晓虹.jpg"], "_n": "宁晓虹", "mentor": true}, {"section": "数字媒体与创意工程教研室", "name": "吕思颖", "date": "2026-05-06", "url": "https://site.gcc.edu.cn/xydw/wlkjaqyszmt/szmtycygcjys1/f56aed30a442495ab290e407e3cdc16e.htm", "text": "吕思颖，硕士研究生，本科与硕士均毕业于广西大学，长期深耕电气工程以及基础数学领域，具备深厚的工科理论基础与跨学科教学素养。参与校级科研项目1项，横向科研项目1项，以第一作者在国内外期刊发表学术论文5篇，其中3篇核心期刊。\n\n教学上，坚持“立德树人”与技术实践并重，主讲《经济数学》《高等数学》《模拟与数字电路》等核心课程，深受学生好评。愿以赤诚之心，培育兼具创新力与工程素养的新时代人才。", "images": ["数字媒体与创意工程教研室/吕思颖.jpg"], "_n": "吕思颖", "mentor": true}, {"section": "数字媒体与创意工程教研室", "name": "刘烨", "date": "2026-05-06", "url": "https://site.gcc.edu.cn/xydw/wlkjaqyszmt/szmtycygcjys1/d78be3e71daf41229b84cfcf4fcb4838.htm", "text": "刘烨，硕士研究生。2021年7月于广州大学获得硕士学历学位证书，2022年9月起在广州商学院担任专任教师，教授课程《高等数学》，《线性代数》，《微积分》，《经济数学》等，目前为止有2次学生评价在前5%，5次在前30%。2023年11月作为第一作者在SCI一区期刊《JOURNAL OF ENVIRONMENTAL CHEMICAL ENGINEERING》发表了论文Highly effective removal of thallium(l) by nanostructured titanium pyrophosphate from acidic wastewater。", "images": ["数字媒体与创意工程教研室/刘烨.jpg"], "_n": "刘烨", "mentor": true}, {"section": "计算机基础教研室", "name": "周维柏", "date": "2026-05-08", "url": "https://site.gcc.edu.cn/xydw/jsjjcjys1/c8b2f15bd46748da9d3b20c36106e2ab.htm", "text": "周维柏，1998年毕业于东北大学，2001年入职广州商学院，高级实验师，现任广州市城市更新专家咨询委员会委员。主讲《计算机应用基础》、《Python程序设计》、《Python大数据分析与应用实训》及《动态网站设计》等课程。主要研究方向为网络安全、模式识别与图像识别。在《Computer Networks》等国内外权威际期刊发表论文30余篇，其中SCI检索5篇、EI检索1篇、中文核心3篇；代表作包括《Revocable-noise federated learning: A quantum-audited and dynamically coordinated framework for zero-loss privacy》等；主编及参编教材5部。长期深耕教学科研一线，致力于计算机应用与人工智能领域的创新实践。", "images": ["计算机基础教研室/周维柏.jpg"], "_n": "周维柏", "mentor": true}, {"section": "计算机基础教研室", "name": "郑燕姣", "date": "2026-05-08", "url": "https://site.gcc.edu.cn/xydw/jsjjcjys1/5bc50d80a28546509799af68cd7731c8.htm", "text": "郑燕姣，硕士研究生，副教授，毕业以来长期深耕高校计算机教学与科研一线，始终坚守教育初心，恪守教师职责，注重思想政治修养与专业素养的持续提升。教学上，努力钻研计算机科学与实践教学，创新课堂教学模式，积极指导学生参加IT 技能竞赛等实践活动，耐心答疑解惑、精准指导，助力学生获得相关赛事奖项，同时着力提升学生实操能力，指导班级的学生计算机等级考试平均通过率优秀，编写的教学实践案例获教育部高校计算机类教指委优秀案例评选一等奖。科研上，发表论文 9 篇，参与编写计算机类教材 1 部，获软件著作 2 个，主持并参与的教改及科研课题8项，教学与科研能力突出，履职尽责、成效显著。", "images": ["计算机基础教研室/郑燕姣.jpg"], "_n": "郑燕姣", "mentor": true}, {"section": "计算机基础教研室", "name": "张锦贤", "date": "2026-05-08", "url": "https://site.gcc.edu.cn/xydw/jsjjcjys1/906428f553d24598bba7971ba8fe44f2.htm", "text": "张锦贤，女，中共党员，硕士研究生，副教授。2012年入职广州商学院，现任计算机基础教学专任教师。\n\n深耕一线教学，近五年共计7次期末考核获评优秀，2023年荣获广州商学院“优秀教师”称号；2024年荣获中共广州商学院“优秀党员”称号。先后获得教学成果奖3项，包括2024年广东省评估教育协会教学成果奖二等奖、广东省计算机学会优秀教学成果奖三等奖，以及2025年广东省计算机学会优秀成果奖三等奖。\n\n坚持理论与实践相结合，自2020年起受聘为“双师双能型”教师。坚持教研融合、以研促教，近五年累计发表学术论文10篇，出版专著1部，授权软件著作权4项；主持及参与各级各类课题近20项，涵盖省级自然科学、省级教改等项目。", "images": ["计算机基础教研室/张锦贤.jpg"], "_n": "张锦贤", "mentor": true}, {"section": "计算机基础教研室", "name": "翁权杰", "date": "2026-05-08", "url": "https://site.gcc.edu.cn/xydw/jsjjcjys1/ba8a7cb0a6f24e0287f6955da1d27340.htm", "text": "翁权杰，男，副教授，毕业于华南师范大学计算机应用技术专业。主讲课程包括有《Python语言程序设计》《高级程序设计》《人工智能通识基础》《数据分析与数据挖掘》《WEB应用开发》等，参与主编《Python程序设计》、《办公软件高级应用》等5部教材。近年来多次带领学生参加大学生计算机设计大赛，获得过国家级奖项1项，省级奖项10余项。\n\n获奖情况：\n\n1、2018年获得教师节“优秀教学奖”\n\n2、2022年获得教师节“优秀教学奖”\n\n3、2024年获得教师节“优秀教学奖”", "images": ["计算机基础教研室/翁权杰.jpg"], "_n": "翁权杰", "mentor": true}, {"section": "计算机基础教研室", "name": "汤兰芳", "date": "2026-05-08", "url": "https://site.gcc.edu.cn/xydw/jsjjcjys1/02f87d627a88474bb9c9d543ef9e51f9.htm", "text": "汤兰芳，硕士，讲师。自2002年任教以来，为学生主讲过《计算机应用基础》、《图形图像处理技术》、《办公软件高级应用》、《人工智能通识教程》等课程，教学经验丰富，注重理论与实践结合，擅长通过案例教学、项目驱动等方式激发学生兴趣，提升学生计算机应用能力；教学效果优秀，多次获得校级绩效考核优秀奖。", "images": ["计算机基础教研室/汤兰芳.jpg"], "_n": "汤兰芳", "mentor": true}, {"section": "计算机基础教研室", "name": "廖俐鹃", "date": "2026-05-08", "url": "https://site.gcc.edu.cn/xydw/jsjjcjys1/6796f00bbee94fbabdaf07154b0396e7.htm", "text": "廖俐鹃，女，1988年11月出生，硕士研究生学历，毕业于华南师范大学教育技术学专业。现任信息技术与工程学院专任教师，副教授职称，信息系统项目管理师高级，获评“双师双能型”教师及校级I类骨干教师。\n\n教学方面，曾获首届教师教学创新大赛二等奖及校级教学成果一等奖，多次学期人事考核获评“优秀”，2024-2025年度教师节“优秀教学奖”。科研方面，近年来发表学术论文7篇，其中EI检索论文2篇；主编及参编教材3本；主持全国高等院校计算机基础教育研究会课题、广州商学院教改课题等省部级及校级教科研项目6项。", "images": ["计算机基础教研室/廖俐鹃.jpg"], "_n": "廖俐鹃", "mentor": true}, {"section": "计算机基础教研室", "name": "梁智斌", "date": "2026-05-08", "url": "https://site.gcc.edu.cn/xydw/jsjjcjys1/b66a5d72849c486eae0797c6b55feca7.htm", "text": "梁智斌，信息技术与工程学院计算机基础教研室专任教师，硕士，讲师。研究领域为信息素养、数字资源建设。教学课程有动态网站设计、小程序应用开发、办公软件高级应用等。近年参与项目2024年广东省本科院校“新时代计算机课程体系与资源建设”专项课题、PHP网页设计课程教研室等教改课题3项。指导学生获广东省“挑战杯”大学生课外学术科技作品竞赛二等奖1项。多次指导学生参与广东省“百千万工程”突击队暨暑期“三下乡”社会实践活动行动获“优秀指导老师”。", "images": ["计算机基础教研室/梁智斌.jpg"], "_n": "梁智斌", "mentor": true}, {"section": "计算机基础教研室", "name": "李蓉", "date": "2026-05-06", "url": "https://site.gcc.edu.cn/xydw/jsjjcjys1/2b9fbe3393a34ca0bdcc6ace01492a9e.htm", "text": "李蓉，1998年毕业于东北大学计算机及应用专业，1999年入职广州商学院，教授。主要研究方向为模式识别、图像识别与人工智能。主讲《计算机应用基础》、《办公软件高级应用》、《数据库技术与应用》及《人工智能通识课》等课程。任教以来累计发表论文30余篇，其中中文核心期刊论文10余篇，长期深耕教学科研一线，在计算机基础教育改革、智能算法应用等领域形成稳定研究方向，具备扎实的学术积累与教学实践能力。", "images": ["计算机基础教研室/李蓉.jpg"], "_n": "李蓉", "mentor": true}, {"section": "计算机基础教研室", "name": "贺琳", "date": "2026-05-06", "url": "https://site.gcc.edu.cn/xydw/jsjjcjys1/04e7e81ced63452183e5972c822337b8.htm", "text": "贺琳，硕士研究生，2012年毕业于华南师范大学，“双师双能”型教师。主讲过《计算机应用基础》《办公软件高级应用》《程序设计基础》《面向对象程序设计》《数据库原理与应用》等多门课程。作为负责人，主持建设1门校级优秀课程，主要研究方向为教学设计、计算机应用。\n\n教学理念：淡化形式，注重实质；深挖基础，慢工细活——力求学生学得懂、用得上。", "images": ["计算机基础教研室/贺琳.jpg"], "_n": "贺琳", "mentor": true}, {"section": "计算机基础教研室", "name": "何惠甜", "date": "2026-05-06", "url": "https://site.gcc.edu.cn/xydw/jsjjcjys1/e825597c1ad84f978dcbf8bb5a2b44c3.htm", "text": "何惠甜，工学硕士，讲师。2002年毕业于华南师范大学，2009年获得中山大学计算机软件与理论专业硕士学位。\n\n现任信息技术与工程学院专任教师，主要担任“人工智能通识基础”、“计算机应用基础”、“办公软件高级应用”、“计算机图像处理技术基础”等课程的教学，丰富的教学与实践经验。\n\n主持和参与省级校级课题多项，发表论文有《RFID防碰撞技术中的算法分析》等13论文。\n\n20多年初心不变，全心致力于高校的教学实践工作中，一直为学校和学生的发展奋斗着。", "images": ["计算机基础教研室/何惠甜.jpg"], "_n": "何惠甜", "mentor": true}, {"section": "数学基础教研室", "name": "周航", "date": "2026-05-08", "url": "https://site.gcc.edu.cn/xydw/sxjcjys1/75b046ff3a3a4182b5730062604b498f.htm", "text": "周航，理学博士，广州商学院信息技术与工程学院数学基础教研室专任教师。本科毕业于天津师范大学数学与应用数学专业，硕士毕业于天津大学基础数学专业，博士毕业于天津大学数学专业。主要从事复合算子理论、多复变函数论 、解析函数空间理论等方向的研究工作。已发表学术论文13篇（其中以第一作者发表10篇，SCI检索论文9篇，北大核心2篇），主持并结题科研项目1项。", "images": ["数学基础教研室/周航.jpg"], "_n": "周航", "mentor": true}, {"section": "数学基础教研室", "name": "钟婷", "date": "2026-05-08", "url": "https://site.gcc.edu.cn/xydw/sxjcjys1/1177407da7a144bb83cc43bbc165b42b.htm", "text": "钟婷，女，中共党员，农业工程与信息技术专业硕士研究生，助教。主要负责经济数学、高等数学等课程。", "images": ["数学基础教研室/钟婷.jpg"], "_n": "钟婷", "mentor": true}, {"section": "数学基础教研室", "name": "赵旭芳", "date": "2026-05-08", "url": "https://site.gcc.edu.cn/xydw/sxjcjys1/f2b53e2128d9463c938161e860dc9ee8.htm", "text": "赵旭芳，女，研究生学历，理学硕士，副教授。主要讲授课程《经济数学》、《高等数学》、《统计学》、《数学建模基础》。多次指导学生在“全国大学生数学建模竞赛”、“全国大学生数学竞赛”等赛事中荣获省级及以上奖项，累计获奖二十余项。研究方向应用数学，已发表多篇学术论文，主持与参与多个省级与校级教研项目。曾获省级优秀指导教师奖、校级优秀教学奖、优秀教风先进个人、学期绩效优秀等荣誉。", "images": ["数学基础教研室/赵旭芳.jpg"], "_n": "赵旭芳", "mentor": true}, {"section": "数学基础教研室", "name": "张于", "date": "2026-05-08", "url": "https://site.gcc.edu.cn/xydw/sxjcjys1/eb3a61d737f845c68c5e375840cd6ed2.htm", "text": "张于，硕士研究生，2019年毕业于洛阳师范学院，2023年毕业于仲恺农业工程学院，2023年至今在广州商学院任教。", "images": ["数学基础教研室/张于.jpg"], "_n": "张于", "mentor": true}, {"section": "数学基础教研室", "name": "张毅", "date": "2026-05-08", "url": "https://site.gcc.edu.cn/xydw/sxjcjys1/1c07bce555a7413baddf289d8d6585e3.htm", "text": "张毅，硕士研究生，毕业于北京林业大学，在校期间专业成绩第一，曾获得国家奖学金、国家励志奖学金、北京市优秀毕业生等奖项。\n\n2022年进入广州商学院任教，主要教授数学课程，课堂氛围活跃，教学评价名列前茅。积极参与教学实践，曾获得课堂教学比赛一等奖、优秀教风先进个人、高数优秀典型课程等奖项，曾指导学生获得广东省数学竞赛一等奖。积极进行学术研究，共在核心期刊发表7篇论文，在教育期刊发表3篇论文。", "images": ["数学基础教研室/张毅.jpg"], "_n": "张毅", "mentor": true}, {"section": "数学基础教研室", "name": "张启涵", "date": "2026-05-08", "url": "https://site.gcc.edu.cn/xydw/sxjcjys1/d29524185246422288aeef211a290dfc.htm", "text": "张启涵，统计学硕士，毕业于加州大学圣地亚哥分校（UCSD），研究方向为概率论和贝叶斯统计，教龄2年，24—25年在国际高中担任A-level数学课程主讲老师，负责课程设计与学业指导；25年至今在广商信工学院担任高等数学课程讲师。", "images": ["数学基础教研室/张启涵.jpg"], "_n": "张启涵", "mentor": true}, {"section": "数学基础教研室", "name": "闫凯", "date": "2026-05-08", "url": "https://site.gcc.edu.cn/xydw/sxjcjys1/2216f1651ef34b8ebdae19cc9f23a348.htm", "text": "闫凯，男，籍贯河南省民权县，理学博士。2005年获国防科技大学应用数学学士学位，2025年获北京大学计算数学博士学位。2005年至2024年任职于西北核技术研究院，2025年任职于广州商学院，研究方向包括微分方程数值解、粒子输运数值模拟及人工智能方法等。研究成果发表在SISC、JCP、JACM等期刊上，曾获中国核学会自然科学一等奖。", "images": ["数学基础教研室/闫凯.jpg"], "_n": "闫凯", "mentor": true}, {"section": "数学基础教研室", "name": "孙雯", "date": "2026-05-08", "url": "https://site.gcc.edu.cn/xydw/sxjcjys1/60c86609636441cfb5dea2c02e32c274.htm", "text": "孙雯，硕士研究生。硕士期间参与国家自然科学基金1项，发表科研论文7篇，授权国家发明专利1项。目前在我校担任公共数学教学工作。", "images": ["数学基础教研室/孙雯.jpg"], "_n": "孙雯", "mentor": true}, {"section": "数学基础教研室", "name": "苏晴", "date": "2026-05-08", "url": "https://site.gcc.edu.cn/xydw/sxjcjys1/d8086851bdb4433b9266772737791ffc.htm", "text": "苏晴，女，中共党员，讲师。2022年进入广州商学院担任专任教师，主要从事数学类课程的教学与科研工作。主讲《高等数学》、《经济数学》、《数学建模》等本科课程。作为指导老师，曾多次带领学生在“全国大学生数学建模竞赛”、“全国大学生数学竞赛”等赛事中荣获省级及以上奖项，累计指导学生获奖十余项。在科研方面，研究方向涵盖混料试验设计与数学建模应用，已发表多篇学术论文。曾获校优秀教学奖、毕业论文优秀指导教师等荣誉。", "images": ["数学基础教研室/苏晴.jpg"], "_n": "苏晴", "mentor": true}, {"section": "数学基础教研室", "name": "肉孜买买提•马合木提", "date": "2026-05-08", "url": "https://site.gcc.edu.cn/xydw/sxjcjys1/2c61e36d406e4b66a6167aec1242020d.htm", "text": "肉孜买买提•马合木提博士毕业于日本大阪大学基础工学研究科，并曾在该校从事博士后研究工作。研究领域涵盖计算数学、数理医学及神经网络稳定性分析。长期与日本大阪大学、法国波尔多大学等知名高校的研究机构保持科研合作。已在国内外期刊上发表论文20余篇，主持过两项科研项目。", "images": ["数学基础教研室/肉孜买买提•马合木提.jpg"], "_n": "肉孜买买提·马合木提", "mentor": true}, {"section": "数学基础教研室", "name": "努日曼", "date": "2026-05-08", "url": "https://site.gcc.edu.cn/xydw/sxjcjys1/1e36849740c2485db5dbca9643fd67dd.htm", "text": "努日曼古丽·牙森老师毕业于日本大阪大学基础工学研究科，获硕士学位。研究领域涵盖反应扩散方程及其自由移劢边界问题的数值模拟算法。近年来在从事教学工作的过程中，注重提升自身综合素养，善于沟通表达与组织协调，能够深入分析学生心理问题。目前，已具备一名教师应有的思想觉悟与工作能力。", "images": ["数学基础教研室/努日曼.jpg"], "_n": "努日曼", "mentor": true}, {"section": "数学基础教研室", "name": "马兴恺", "date": "2026-05-08", "url": "https://site.gcc.edu.cn/xydw/sxjcjys1/68083b7800a44bdca6b50dc8b74e93b8.htm", "text": "马兴恺，硕士研究生。研究方向：流体力学的数值计算，深海采矿中的数学问题等。硕士毕业于湘潭大学数学专业。参与纵向项目3项，并于期刊Computers and Geotechnics及Applied Mathematics and Mechanics (English edition) 发表SCI论文2篇。", "images": ["数学基础教研室/马兴恺.jpg"], "_n": "马兴恺", "mentor": true}, {"section": "数学基础教研室", "name": "龙君", "date": "2026-05-08", "url": "https://site.gcc.edu.cn/xydw/sxjcjys1/730f266b30a64de9a9e59398d239dbf1.htm", "text": "龙君，男，副教授，中山大学理学博士，运筹学与控制论专业，主要研究方向为最优化理论与方法、金融工程与风险管理、金融经济学及不确定理论等。现广商信工数学基础教研室专任教师。教学上，主要承担《运筹学》《统计学》《Python 程序设计》等多门课程教学任务，长期负责学生实习与毕业设计指导工作。科研上，主持省厅级项目 1 项，参与国家级项目 2 项，主持及参与多项校级教改、教材编写与科研课题。在 JIK、AMC 及模糊系统与数学、计算机工程与应用等国内外重要期刊发表学术论文 30 余篇，其中 6 篇被 SCI/EI 收录（1篇为JCR一区），具备扎实的教学能力与稳定的科研研究方向。", "images": ["数学基础教研室/龙君.jpg"], "_n": "龙君", "mentor": true}, {"section": "数学基础教研室", "name": "张新文", "date": "2026-05-08", "url": "https://site.gcc.edu.cn/xydw/sxjcjys1/4b2a0b3b7ea74b5ea46be48e8a9b1559.htm", "text": "张新文，硕士研究生，教授。近年来以第一作者或独撰发表SCI、EI、中文核心等论文20余篇；编写教材多部；主持完成全国自然科学研究项目、广东省特色创新项目(自然科学类)、广东省本科高校高等教育教学改革项目、广东省本科高校课程思政示范课程项目、校级重大科研项目等10多项；指导学生参加全国大学生数学建模竞赛获广东省一、二、三等奖等几十项；获全国大学生数学建模竞赛广东省优秀指导教师奖、第三届中青年教师教学大赛二等奖等，多次获得“优秀教学奖”、“优秀科研奖”和“优秀共产党员”等荣誉。", "ima
